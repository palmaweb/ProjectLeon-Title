<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Broadcast Admin Panel</title>

<style>
body {
  margin: 0;
  font-family: Tahoma;
  background: #0f172a;
  color: #fff;
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  background: #111827;
  height: 100vh;
  padding: 15px;
}

.sidebar h2 {
  font-size: 16px;
  margin-bottom: 20px;
}

.menu {
  display: flex;
  flex-direction: column;
}

.menu button {
  background: none;
  border: none;
  color: #ccc;
  text-align: right;
  padding: 10px;
  cursor: pointer;
  border-radius: 6px;
}

.menu button:hover {
  background: #1f2937;
  color: #fff;
}

/* MAIN */
.main {
  flex: 1;
  padding: 20px;
}

/* CARD STYLE */
.card {
  background: #111827;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  margin-bottom: 10px;
  border-radius: 6px;
  border: none;
}

/* BUTTONS */
.btn {
  padding: 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 5px;
}

.save {
  background: #22c55e;
}

.reset {
  background: #ef4444;
}
</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>🎛 کنترل پنل</h2>
  <div class="menu">
    <button onclick="showTab('general')">تنظیمات عمومی</button>
    <button onclick="showTab('text')">متن‌ها</button>
    <button onclick="showTab('media')">لوگو و آیکون</button>
    <button onclick="setPreset('fox')">FOX Preset</button>
    <button onclick="setPreset('news')">News Preset</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- GENERAL -->
  <div id="general" class="card">
    <h3>تنظیمات عمومی</h3>

    <label>عرض</label>
    <input id="width">

    <label>ارتفاع</label>
    <input id="height">
  </div>

  <!-- TEXT -->
  <div id="text" class="card">
    <h3>متن‌ها</h3>

    <label>تیتر اصلی</label>
    <input id="t1">

    <label>تیتر دوم</label>
    <input id="t2">
  </div>

  <!-- MEDIA -->
  <div id="media" class="card">
    <h3>رسانه</h3>

    <label>لوگو URL</label>
    <input id="logo">

    <label>آیکون URL</label>
    <input id="icon">
  </div>

  <button class="btn save" id="saveBtn">ذخیره</button>
  <button class="btn reset" id="resetBtn">ریست</button>

  <p id="status"></p>

</div>

<script src="app.js"></script>

<script>
function showTab(id){
  document.querySelectorAll('.card').forEach(c=>c.style.display='none');
  document.getElementById(id).style.display='block';
}
showTab('general');
  function getState() {
  var data = localStorage.getItem("subtitle_state");

  return data ? JSON.parse(data) : {
    width: 1200,
    height: 150,
    logo: "",
    icon: "",
    title1: "تیتر اصلی",
    title2: "زیرتیتر"
  };
}

function setState(state) {
  localStorage.setItem("subtitle_state", JSON.stringify(state));

  // این خط باعث میشه viewer سریع بفهمه تغییر شده
  localStorage.setItem("subtitle_ping", Date.now());
}
</script>

</body>
</html>
