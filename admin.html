<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت Overlay</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="container">

    <div class="sidebar">

        <h2>
            پنل مدیریت
        </h2>

    </div>

    <div class="content">

        <div class="card">

            <h3>
                متن ها
            </h3>

            <label>
                تیتر اصلی
            </label>

            <input
                type="text"
                id="title"
            >

            <label>
                زیر تیتر
            </label>

            <input
                type="text"
                id="subtitle"
            >

        </div>

        <div class="card">

            <h3>
                تنظیمات ظاهری
            </h3>

            <label>
                رنگ پنل
            </label>

            <input
                type="color"
                id="panelColor"
            >

            <label>
                رنگ تیتر
            </label>

            <input
                type="color"
                id="titleColor"
            >

            <label>
                رنگ زیر تیتر
            </label>

            <input
                type="color"
                id="subtitleColor"
            >

        </div>

        <div class="card">

            <h3>
                لوگو
            </h3>

            <label>
                لینک لوگو
            </label>

            <input
                type="text"
                id="logo"
                placeholder="assets/logo.png"
            >

        </div>

        <div class="card">

            <h3>
                LIVE
            </h3>

            <select id="live">

                <option value="on">
                    روشن
                </option>

                <option value="off">
                    خاموش
                </option>

            </select>

        </div>

        <button onclick="saveData()">
            ذخیره تغییرات
        </button>

    </div>

</div>

<script src="admin.js"></script>

</body>
</html>
