<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="panel">

<h1>Broadcast Admin</h1>

<label>Width</label>
<input type="number" id="width" value="1200">

<label>Height</label>
<input type="number" id="height" value="200">

<label>Background Color</label>
<input type="color" id="bgColor" value="#1f1f1f">

<label>Title</label>
<input type="text" id="title">

<label>Subtitle</label>
<textarea id="subtitle"></textarea>

<label>Title Color</label>
<input type="color" id="titleColor" value="#ffffff">

<label>Subtitle Color</label>
<input type="color" id="subtitleColor" value="#ffffff">

<label>Title Size</label>
<input type="number" id="titleSize" value="56">

<label>Subtitle Size</label>
<input type="number" id="subtitleSize" value="28">

<label>Logo URL</label>
<input type="text" id="logo">

<button onclick="saveData()">
SAVE
</button>

</div>

<script src="admin.js"></script>

</body>
</html>
