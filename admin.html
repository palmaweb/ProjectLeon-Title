<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <title>Broadcast Admin Panel</title>

  <style>
    body{
      margin:0;
      font-family: Vazirmatn, IRANYekanX, IRANSansX;
      background:#0b0f1a;
      color:#fff;
      display:flex;
      height:100vh;
    }

    .sidebar{
      width:290px;
      background:#11182a;
      padding:15px;
      overflow-y:auto;
      border-left:1px solid rgba(255,255,255,0.05);
    }

    .main{
      flex:1;
      padding:20px;
      overflow-y:auto;
    }

    h2{
      font-size:13px;
      color:#4ea1ff;
      margin:12px 0;
    }

    .box{
      background:#141c30;
      padding:12px;
      border-radius:10px;
      margin-bottom:12px;
      border:1px solid rgba(255,255,255,0.05);
    }

    label{
      font-size:11px;
      color:#aaa;
      display:block;
      margin-top:8px;
    }

    input,select{
      width:100%;
      padding:7px;
      margin-top:4px;
      border-radius:8px;
      border:none;
      background:#0b1220;
      color:#fff;
      outline:none;
      font-size:12px;
    }

    input[type="range"]{padding:0;}

    button{
      width:100%;
      padding:10px;
      margin-top:10px;
      background:#2d7dff;
      border:none;
      color:#fff;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
      font-size:12px;
    }

    button:hover{background:#1f66d1;}

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .small{
      font-size:10px;
      color:#888;
    }
  </style>
</head>
  <div id="loginBox" style="
position:fixed;
inset:0;
background:#0b0f1a;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
">

  <div style="background:#141c30;padding:20px;border-radius:12px;width:250px">
    <h3 style="color:#fff;text-align:center">Admin Login</h3>

    <input id="passInput" type="password" placeholder="Password"
    style="width:100%;padding:10px;margin-top:10px">

    <button onclick="checkPass()" style="
    width:100%;margin-top:10px;padding:10px;
    background:#2d7dff;color:#fff;border:none;border-radius:8px">
      ورود
    </button>

    <p id="err" style="color:red;text-align:center;font-size:12px"></p>
  </div>

</div>
<body>

<div class="sidebar">

  <h2>✍ متن</h2>

  <div class="box">
    <label>تیتر</label>
    <input id="titleText">

    <label>فونت</label>
    <select id="titleFont">
      <option>IRANYekanX</option>
      <option>Vazirmatn</option>
      <option>IRANSansX</option>
    </select>

    <label>وزن</label>
    <select id="titleWeight">
      <option value="100">Thin</option>
      <option value="300">Light</option>
      <option value="400">Regular</option>
      <option value="700">Bold</option>
      <option value="900">ExtraBold</option>
    </select>

    <label>سایز</label>
    <input type="range" id="titleSize" min="10" max="80">

    <label>رنگ</label>
    <input type="color" id="titleColor">
  </div>

  <div class="box">
    <label>زیرتیتر</label>
    <input id="subText">

    <label>فونت</label>
    <select id="subFont">
      <option>IRANYekanX</option>
      <option>Vazirmatn</option>
      <option>IRANSansX</option>
    </select>

    <label>وزن</label>
    <select id="subWeight">
      <option value="100">Thin</option>
      <option value="400">Regular</option>
      <option value="700">Bold</option>
      <option value="800">ExtraBold</option>
    </select>

    <label>سایز</label>
    <input type="range" id="subSize" min="8" max="50">

    <label>رنگ</label>
    <input type="color" id="subColor">
  </div>

  <button onclick="saveText()">ذخیره متن</button>

</div>

<div class="main">

  <h2>🧱 کادر</h2>
  <div class="box">

    <div class="grid">
      <div>
        <label>عرض</label>
        <input type="number" id="width">
      </div>
      <div>
        <label>ارتفاع</label>
        <input type="number" id="height">
      </div>
    </div>

    <label>رنگ کادر</label>
    <input type="color" id="bgColor">

    <label>Opacity</label>
    <input type="range" id="opacity" min="0" max="1" step="0.05">

    <button onclick="saveContainer()">ذخیره کادر</button>
  </div>

  <h2>🖼 لوگو شبکه (URL)</h2>
  <div class="box">
    <label>آدرس لوگو</label>
    <input id="logoUrl" placeholder="https://...">
    <p class="small">GitHub / CDN / Direct URL</p>
    <button onclick="saveLogoUrl()">ذخیره لوگو</button>
  </div>

  <h2>🔴 آیکون LIVE / وضعیت</h2>
  <div class="box">

    <label>نوع آیکون</label>
    <select id="iconType">
      <option value="off">OFF</option>
      <option value="live">LIVE</option>
      <option value="breaking">BREAKING</option>
      <option value="alert">ALERT</option>
      <option value="custom">CUSTOM URL</option>
    </select>

    <label>URL آیکون (فقط اگر custom)</label>
    <input id="iconUrl" placeholder="https://.../icon.png">

    <label>اندازه آیکون</label>
    <input type="range" id="iconSize" min="10" max="60">

    <label>موقعیت</label>
    <select id="iconPosition">
      <option value="right">Right</option>
      <option value="left">Left</option>
    </select>

    <button onclick="saveIcon()">ذخیره آیکون</button>
  </div>

  <h2>⏱ ساعت جهانی</h2>

<div class="box">

  <label>فعال</label>
  <select id="clockEnabled">
    <option value="true">ON</option>
    <option value="false">OFF</option>
  </select>

  <label>زمان تغییر کشورها (ثانیه)</label>
  <input type="range"
         id="clockInterval"
         min="5"
         max="60">

  <label>حالت نمایش</label>
  <select id="clockMode">
    <option value="all">All</option>
    <option value="iran">Iran</option>
    <option value="usa">USA</option>
    <option value="europe">Europe</option>
    <option value="israel">Israel</option>
  </select>

  <label>سایز نام کشور</label>
  <input type="range"
         id="clockCountrySize"
         min="8"
         max="40">

  <label>سایز ساعت</label>
  <input type="range"
         id="clockTimeSize"
         min="10"
         max="60">

  <button onclick="saveClock()">
    ذخیره ساعت
  </button>

</div>

  <h2>🎞 ترنزیشن</h2>
  <div class="box">

    <label>نوع</label>
    <select id="transitionType">
      <option>fade</option>
      <option>slide</option>
      <option>zoom</option>
      <option>glitch</option>
      <option>typewriter</option>
    </select>

    <label>مدت</label>
    <input type="range" id="transitionDuration" min="100" max="2000">

    <button onclick="saveTransition()">ذخیره</button>
  </div>

</div>

<script>

const STORAGE_KEY = "broadcast_settings";
const defaultState = { title:{}, subtitle:{}, container:{}, logo:{}, icon:{}, clock:{}, transition:{} };

function loadState(){
  return JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultState;
}

function saveState(state){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  window.dispatchEvent(new Event("broadcast_update"));
}

let state = loadState();

function safeSet(path,value){
  const keys = path.split(".");
  let obj = state;
  for(let i=0;i<keys.length-1;i++){
    obj[keys[i]] = obj[keys[i]] || {};
    obj = obj[keys[i]];
  }
  obj[keys[keys.length-1]] = value;
}

function saveText(){
  safeSet("title.text", titleText.value);
  safeSet("title.font", titleFont.value);
  safeSet("title.weight", titleWeight.value);
  safeSet("title.size", titleSize.value);
  safeSet("title.color", titleColor.value);

  safeSet("subtitle.text", subText.value);
  safeSet("subtitle.font", subFont.value);
  safeSet("subtitle.weight", subWeight.value);
  safeSet("subtitle.size", subSize.value);
  safeSet("subtitle.color", subColor.value);

  saveState(state);
}

function saveContainer(){
  safeSet("container.width", +width.value);
  safeSet("container.height", +height.value);
  safeSet("container.bgColor", bgColor.value);
  safeSet("container.opacity", opacity.value);
  saveState(state);
}

function saveLogoUrl(){
  safeSet("logo.url", logoUrl.value);
  saveState(state);
}

function saveClock(){

  safeSet(
    "clock.enabled",
    clockEnabled.value === "true"
  );

  safeSet(
    "clock.interval",
    +clockInterval.value
  );

  safeSet(
    "clock.mode",
    clockMode.value
  );

  safeSet(
    "clock.countrySize",
    +clockCountrySize.value
  );

  safeSet(
    "clock.timeSize",
    +clockTimeSize.value
  );

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

  window.dispatchEvent(
    new Event("broadcast_update")
  );
}

function saveTransition(){
  safeSet("transition.type", transitionType.value);
  safeSet("transition.duration", transitionDuration.value);
  saveState(state);
}

function saveIcon(){
  safeSet("icon.type", iconType.value);
  safeSet("icon.url", iconUrl.value);
  safeSet("icon.size", iconSize.value);
  safeSet("icon.position", iconPosition.value);
  saveState(state);
}

  function hydrate(){

  /* TITLE */
  titleText.value =
    state.title?.text || "";

  titleFont.value =
    state.title?.font || "Vazirmatn";

  titleWeight.value =
    state.title?.weight || "700";

  titleSize.value =
    state.title?.size || 28;

  titleColor.value =
    state.title?.color || "#ffffff";

  /* SUBTITLE */
  subText.value =
    state.subtitle?.text || "";

  subFont.value =
    state.subtitle?.font || "Vazirmatn";

  subWeight.value =
    state.subtitle?.weight || "400";

  subSize.value =
    state.subtitle?.size || 18;

  subColor.value =
    state.subtitle?.color || "#dddddd";

  /* CONTAINER */
  width.value =
    state.container?.width || 900;

  height.value =
    state.container?.height || 160;

  bgColor.value =
    state.container?.bgColor || "#000000";

  opacity.value =
    state.container?.opacity || 0.6;

  /* LOGO */
  logoUrl.value =
    state.logo?.url || "";

  /* ICON */
  iconType.value =
    state.icon?.type || "off";

  iconUrl.value =
    state.icon?.url || "";

  iconSize.value =
    state.icon?.size || 100;

  iconPosition.value =
    state.icon?.position || "right";

  /* CLOCK */
  clockEnabled.value =
    String(state.clock?.enabled ?? true);

  clockInterval.value =
    state.clock?.interval || 10;

  clockMode.value =
    state.clock?.mode || "all";

  clockCountrySize.value =
    state.clock?.countrySize || 11;

  clockTimeSize.value =
    state.clock?.timeSize || 16;

  /* TRANSITION */
  transitionType.value =
    state.transition?.type || "fade";

  transitionDuration.value =
    state.transition?.duration || 400;

}
  hydrate();
  const inputs = document.querySelectorAll("input, select");

inputs.forEach(el => {
  el.addEventListener("input", () => {
    // فقط save مربوط به بخش خودش اجرا شود
    if(el.closest(".box")){
      tryAutoSave(el);
    }
  });

  el.addEventListener("change", () => {
    if(el.closest(".box")){
      tryAutoSave(el);
    }
  });
});

function tryAutoSave(el){

  // TEXT
  if(["titleText","titleFont","titleWeight","titleSize","titleColor"].includes(el.id) ||
     ["subText","subFont","subWeight","subSize","subColor"].includes(el.id)){
    saveText();
  }

  // CONTAINER
  if(["width","height","bgColor","opacity"].includes(el.id)){
    saveContainer();
  }

  // LOGO
  if(el.id === "logoUrl"){
    saveLogoUrl();
  }

  // ICON
  if(["iconType","iconUrl","iconSize","iconPosition"].includes(el.id)){
    saveIcon();
  }

  // CLOCK
  if(["clockEnabled","clockInterval","clockMode","clockCountrySize","clockTimeSize"].includes(el.id)){
    saveClock();
  }

  // TRANSITION
  if(["transitionType","transitionDuration"].includes(el.id)){
    saveTransition();
  }

}
  function getState(){
  return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    title:{},
    subtitle:{},
    container:{},
    logo:{},
    icon:{},
    clock:{},
    transition:{}
  };
}
  const ADMIN_PASS = "1234"; // ← رمز دلخواه تو

function checkPass(){

  const input =
    document.getElementById("passInput").value;

  if(input === ADMIN_PASS){

    localStorage.setItem("auth","ok");

    document.getElementById("loginBox").style.display = "none";

  }else{

    document.getElementById("err").innerText =
      "رمز اشتباه است";
  }
}

/* AUTO CHECK */
window.onload = function(){

  if(localStorage.getItem("auth") === "ok"){

    document.getElementById("loginBox").style.display = "none";
  }
};
</script>

</body>
</html>
