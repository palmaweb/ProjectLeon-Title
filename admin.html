<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Control Panel</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
<h2>🎛 STUDIO</h2>

<button class="tab active" data-tab="overlay">Overlay</button>
<button class="tab" data-tab="text">Text</button>
<button class="tab" data-tab="fonts">Fonts</button>
<button class="tab" data-tab="colors">Colors</button>
<button class="tab" data-tab="animation">Animation</button>

<hr>

<button id="saveBtn" class="save">💾 SAVE</button>
<button id="resetBtn" class="reset">♻ RESET</button>

</div>

<!-- PANEL -->
<div class="panel">

<!-- OVERLAY -->
<div class="section active" id="overlay">

<h3>Overlay</h3>

<label>Width</label>
<input id="width" type="number">

<label>Height</label>
<input id="height" type="number">

<label>Radius</label>
<input id="radius" type="number">

</div>

<!-- TEXT -->
<div class="section" id="text">

<h3>Text</h3>

<label>Title</label>
<input id="title" type="text">

<label>Subtitle</label>
<textarea id="subtitle"></textarea>

</div>

<!-- FONTS -->
<div class="section" id="fonts">

<h3>Fonts</h3>

<label>Title Font</label>
<select id="titleFont">
<option>IRANSans</option>
<option>Vazir</option>
<option>Yekan</option>
<option>Ray</option>
</select>

<label>Subtitle Font</label>
<select id="subtitleFont">
<option>IRANSans</option>
<option>Vazir</option>
<option>Yekan</option>
<option>Ray</option>
</select>

</div>

<!-- COLORS -->
<div class="section" id="colors">

<h3>Colors</h3>

<label>Background</label>
<input id="bgColor" type="color">

<label>Title Color</label>
<input id="titleColor" type="color">

<label>Subtitle Color</label>
<input id="subtitleColor" type="color">

</div>

<!-- ANIMATION -->
<div class="section" id="animation">

<h3>Animation</h3>

<select id="transition">
<option value="fade">Fade</option>
<option value="slide">Slide</option>
<option value="zoom">Zoom</option>
</select>

</div>

</div>

<!-- PREVIEW -->
<div class="preview">
<div class="hint">LIVE OUTPUT (index.html)</div>
<iframe src="index.html"></iframe>
</div>

</div>

<script src="admin.js"></script>
</body>
</html>
