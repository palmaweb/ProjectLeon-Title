<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت Overlay</title>

<style>

@font-face{

    font-family:"Vazirmatn";

    src:url("fonts/Vazirmatn-Regular.ttf");
}

body{

    background:#0f172a;

    color:white;

    font-family:"Vazirmatn";

    padding:40px;

    direction:rtl;
}

.container{

    max-width:900px;

    margin:auto;
}

.card{

    background:#111827;

    padding:30px;

    border-radius:24px;

    box-shadow:0 0 25px rgba(0,0,0,0.4);

    margin-bottom:30px;
}

h1{

    margin-bottom:30px;
}

label{

    display:block;

    margin-bottom:10px;

    font-size:18px;
}

input{

    width:100%;

    padding:16px;

    border:none;

    border-radius:14px;

    margin-bottom:20px;

    font-size:18px;

    font-family:"Vazirmatn";
}

button{

    background:#2563eb;

    color:white;

    border:none;

    padding:16px 45px;

    border-radius:14px;

    font-size:20px;

    cursor:pointer;

    font-family:"Vazirmatn";
}

button:hover{

    opacity:0.9;
}

</style>

</head>

<body>

<div class="container">

<h1>پنل مدیریت خبر</h1>

<div class="card">

<label>تیتر اصلی</label>
<input type="text" id="title">

<label>زیر تیتر</label>
<input type="text" id="subtitle">

<label>لینک لوگو</label>
<input type="text" id="logo" placeholder="logo.png">

<label>رنگ بک گراند پنل</label>
<input type="color" id="panelColor">

<label>رنگ تیتر</label>
<input type="color" id="titleColor">

<label>رنگ زیر تیتر</label>
<input type="color" id="subtitleColor">

<button onclick="saveData()">
ذخیره تغییرات
</button>

</div>

</div>

<script src="admin.js"></script>

</body>
</html>
