<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broadcast Admin</title>

<link rel="stylesheet" href="assets/fonts/fonts.css">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b1020;
  color:#fff;
  font-family:Vazirmatn,IRANYekanX,IRANSansX,sans-serif;

  display:flex;
  height:100vh;
}

.sidebar{
  width:320px;
  background:#121a2d;
  padding:16px;
  overflow-y:auto;
  border-left:1px solid rgba(255,255,255,.05);
}

.main{
  flex:1;
  overflow-y:auto;
  padding:20px;
}

h2{
  font-size:13px;
  color:#58a6ff;
  margin:10px 0;
}

.box{
  background:#151f36;
  border:1px solid rgba(255,255,255,.05);
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
}

label{
  display:block;
  margin-top:8px;
  margin-bottom:4px;
  font-size:11px;
  color:#a9b2c3;
}

input,select{
  width:100%;
  background:#0b1324;
  border:none;
  border-radius:10px;
  color:#fff;
  padding:10px;
  outline:none;
}

input[type='range']{
  padding:0;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button{
  width:100%;
  border:none;
  border-radius:12px;
  padding:12px;
  background:#2d7dff;
  color:#fff;
  cursor:pointer;
  font-weight:700;
  margin-top:12px;
}

</style>
</head>
<body>

<div class="sidebar">

  <h2>متن</h2>

  <div class="box">

    <label>تیتر</label>
    <input id="titleText">

    <label>سایز</label>
    <input type="range" min="10" max="80" id="titleSize">

    <label>رنگ</label>
    <input type="color" id="titleColor">

    <label>وزن</label>
    <select id="titleWeight">
      <option value="300">Light</option>
      <option value="400">Regular</option>
      <option value="700">Bold</option>
      <option value="800">ExtraBold</option>
    </select>

    <label>فونت</label>
    <select id="titleFont">
      <option>Vazirmatn</option>
      <option>IRANYekanX</option>
      <option>IRANSansX</option>
    </select>

  </div>

  <div class="box">

    <label>زیرتیتر</label>
    <input id="subText">

    <label>سایز</label>
    <input type="range" min="10" max="50" id="subSize">

    <label>رنگ</label>
    <input type="color" id="subColor">

    <label>وزن</label>
    <select id="subWeight">
      <option value="300">Light</option>
      <option value="400">Regular</option>
      <option value="700">Bold</option>
    </select>

    <label>فونت</label>
    <select id="subFont">
      <option>Vazirmatn</option>
      <option>IRANYekanX</option>
      <option>IRANSansX</option>
    </select>

  </div>

</div>

<div class="main">

  <h2>کادر</h2>

  <div class="box">

    <div class="grid">

      <div>
        <label>عرض</label>
        <input type="number" id="width">
      </div>

      <div>
        <label>ارتفاع</label>
        <input type="number" id="height">
      </div>

    </div>

    <label>رنگ</label>
    <input type="color" id="bgColor">

    <label>Opacity</label>
    <input type="range" min="0" max="1" step="0.05" id="opacity">

  </div>

  <h2>لوگو</h2>

  <div class="box">
    <label>URL</label>
    <input id="logoUrl">
  </div>

  <h2>آیکون</h2>

  <div class="box">

    <label>نوع</label>
    <select id="iconType">
      <option value="off">OFF</option>
      <option value="live">LIVE</option>
      <option value="breaking">BREAKING</option>
      <option value="alert">ALERT</option>
      <option value="custom">CUSTOM</option>
    </select>

    <label>URL</label>
    <input id="iconUrl">

    <label>اندازه</label>
    <input type="range" min="20" max="200" id="iconSize">

    <label>موقعیت</label>
    <select id="iconPosition">
      <option value="right">Right</option>
      <option value="left">Left</option>
    </select>

  </div>

  <h2>ساعت</h2>

  <div class="box">

    <label>فعال</label>
    <select id="clockEnabled">
      <option value="true">ON</option>
      <option value="false">OFF</option>
    </select>

    <label>کشور</label>
    <select id="clockZone">
      <option value="Asia/Tehran">Iran</option>
      <option value="Europe/Berlin">Europe</option>
      <option value="America/New_York">USA</option>
      <option value="Asia/Jerusalem">Israel</option>
    </select>

    <label>عنوان</label>
    <input id="clockLabel">

    <label>سایز نام کشور</label>
    <input type="range" min="10" max="40" id="countrySize">

    <label>سایز ساعت</label>
    <input type="range" min="10" max="60" id="timeSize">

  </div>

  <h2>ترنزیشن</h2>

  <div class="box">

    <label>نوع</label>
    <select id="transitionType">
      <option value="fade">Fade</option>
      <option value="slide">Slide</option>
      <option value="zoom">Zoom</option>
    </select>

    <label>مدت</label>
    <input type="range" min="100" max="3000" id="transitionDuration">

  </div>

</div>

<script>

const STORAGE_KEY = 'broadcast_overlay_state';

let state = JSON.parse(
  localStorage.getItem(STORAGE_KEY)
);

function save(){

  state.title.text = titleText.value;
  state.title.size = +titleSize.value;
  state.title.color = titleColor.value;
  state.title.weight = +titleWeight.value;
  state.title.font = titleFont.value;

  state.subtitle.text = subText.value;
  state.subtitle.size = +subSize.value;
  state.subtitle.color = subColor.value;
  state.subtitle.weight = +subWeight.value;
  state.subtitle.font = subFont.value;

  state.container.width = +width.value;
  state.container.height = +height.value;
  state.container.bgColor = bgColor.value;
  state.container.opacity = +opacity.value;

  state.logo.url = logoUrl.value;

  state.icon.type = iconType.value;
  state.icon.url = iconUrl.value;
  state.icon.size = +iconSize.value;
  state.icon.position = iconPosition.value;

  state.clock.enabled =
    clockEnabled.value === 'true';

  state.clock.timezone =
    clockZone.value;

  state.clock.label =
    clockLabel.value;

  state.clock.countrySize =
    +countrySize.value;

  state.clock.timeSize =
    +timeSize.value;

  state.transition.type =
    transitionType.value;

  state.transition.duration =
    +transitionDuration.value;

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );
}

function hydrate(){

  titleText.value = state.title.text;
  titleSize.value = state.title.size;
  titleColor.value = state.title.color;
  titleWeight.value = state.title.weight;
  titleFont.value = state.title.font;

  subText.value = state.subtitle.text;
  subSize.value = state.subtitle.size;
  subColor.value = state.subtitle.color;
  subWeight.value = state.subtitle.weight;
  subFont.value = state.subtitle.font;

  width.value = state.container.width;
  height.value = state.container.height;
  bgColor.value = state.container.bgColor;
  opacity.value = state.container.opacity;

  logoUrl.value = state.logo.url;

  iconType.value = state.icon.type;
  iconUrl.value = state.icon.url;
  iconSize.value = state.icon.size;
  iconPosition.value = state.icon.position;

  clockEnabled.value = String(state.clock.enabled);
  clockZone.value = state.clock.timezone;
  clockLabel.value = state.clock.label;
  countrySize.value = state.clock.countrySize;
  timeSize.value = state.clock.timeSize;

  transitionType.value = state.transition.type;
  transitionDuration.value = state.transition.duration;
}

hydrate();

[
  ...document.querySelectorAll('input'),
  ...document.querySelectorAll('select')
].forEach(el=>{

  el.addEventListener('input',save);
  el.addEventListener('change',save);

});

</script>
</body>
</html>
