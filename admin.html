<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broadcast Admin</title>

<style>
body{
  margin:0;
  font-family: Vazirmatn;
  background:#0b0f1a;
  color:#fff;
  display:flex;
  height:100vh;
}

.sidebar{
  width:300px;
  background:#11182a;
  padding:15px;
  overflow-y:auto;
}

.main{
  flex:1;
  padding:20px;
}

.box{
  background:#141c30;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
}

label{font-size:12px;color:#aaa;display:block;margin-top:8px;}
input,select{
  width:100%;
  padding:7px;
  margin-top:4px;
  border-radius:8px;
  border:none;
  background:#0b1220;
  color:#fff;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:#2d7dff;
  color:#fff;
  border:none;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="sidebar">

<h3>Text</h3>
<div class="box">
<input id="titleText" placeholder="Title">
<input id="subText" placeholder="Subtitle">
</div>

<h3>Container</h3>
<div class="box">
<input id="width" type="number" placeholder="Width">
<input id="height" type="number" placeholder="Height">
<input id="bgColor" type="color">
<input id="opacity" type="range" min="0" max="1" step="0.05">
</div>

<h3>Logo</h3>
<div class="box">
<input id="logoUrl" placeholder="Logo URL">
<label>Logo Size</label>
<input id="logoSize" type="range" min="20" max="200">
</div>

<h3>Icon</h3>
<div class="box">
<select id="iconType">
<option value="off">OFF</option>
<option value="live">LIVE</option>
<option value="breaking">BREAKING</option>
<option value="alert">ALERT</option>
<option value="custom">CUSTOM</option>
</select>

<input id="iconUrl" placeholder="Icon URL">
</div>

<h3>Clock</h3>
<div class="box">
<select id="clockEnabled">
<option value="true">ON</option>
<option value="false">OFF</option>
</select>
<input id="clockInterval" type="range" min="5" max="60">
</div>

<button onclick="save()">SAVE</button>

</div>

<div class="main">
<h2>Broadcast Admin Panel</h2>
</div>

<script>

const KEY = "broadcast_settings";

let state = JSON.parse(localStorage.getItem(KEY)) || {
  title:{},
  subtitle:{},
  container:{},
  logo:{},
  icon:{},
  clock:{}
};

function safeSet(path,val){
  let obj = state;
  let keys = path.split(".");
  for(let i=0;i<keys.length-1;i++){
    obj[keys[i]] = obj[keys[i]] || {};
    obj = obj[keys[i]];
  }
  obj[keys[keys.length-1]] = val;
}

function save(){
  safeSet("title.text", titleText.value);
  safeSet("subtitle.text", subText.value);

  safeSet("container.width", +width.value);
  safeSet("container.height", +height.value);
  safeSet("container.bgColor", bgColor.value);
  safeSet("container.opacity", opacity.value);

  safeSet("logo.url", logoUrl.value);
  safeSet("logo.size", +logoSize.value);

  safeSet("icon.type", iconType.value);
  safeSet("icon.url", iconUrl.value);

  safeSet("clock.enabled", clockEnabled.value === "true");
  safeSet("clock.interval", +clockInterval.value);

  localStorage.setItem(KEY, JSON.stringify(state));
  window.dispatchEvent(new Event("broadcast_update"));
}

/* 🧠 IMPORTANT: fill UI after reload */
function hydrate(){
  titleText.value = state.title?.text || "";
  subText.value = state.subtitle?.text || "";

  width.value = state.container?.width || 600;
  height.value = state.container?.height || 120;
  bgColor.value = state.container?.bgColor || "#000000";
  opacity.value = state.container?.opacity || 0.5;

  logoUrl.value = state.logo?.url || "";
  logoSize.value = state.logo?.size || 55;

  iconType.value = state.icon?.type || "off";
  iconUrl.value = state.icon?.url || "";

  clockEnabled.value = String(state.clock?.enabled ?? true);
  clockInterval.value = state.clock?.interval || 10;
}

hydrate();

</script>

</body>
</html>
