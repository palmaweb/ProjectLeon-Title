<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO Broadcast Panel</title>

<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">

<h2>🎛 CONTROL</h2>

<button class="tab active" data-tab="overlay">Overlay</button>
<button class="tab" data-tab="text">Text</button>
<button class="tab" data-tab="fonts">Fonts</button>
<button class="tab" data-tab="colors">Colors</button>
<button class="tab" data-tab="animation">Animation</button>

<hr>

<button id="saveBtn" class="save">💾 SAVE</button>

</div>

<!-- PANEL -->
<div class="panel">

<!-- OVERLAY -->
<div class="section active" id="overlay">
<h3>Overlay Settings</h3>

<label>Width</label>
<input id="width" type="number" value="1200">

<label>Height</label>
<input id="height" type="number" value="200">

<label>Radius</label>
<input id="radius" type="number" value="20">
</div>

<!-- TEXT -->
<div class="section" id="text">
<h3>Text</h3>

<label>Title</label>
<input id="title" type="text" value="BREAKING NEWS">

<label>Subtitle</label>
<textarea id="subtitle">Live broadcast text</textarea>
</div>

<!-- FONTS -->
<div class="section" id="fonts">
<h3>Fonts</h3>

<label>Title Font</label>
<select id="titleFont">
<option>IRANSans</option>
<option>Vazir</option>
<option>Yekan</option>
<option>Ray</option>
</select>

<label>Subtitle Font</label>
<select id="subtitleFont">
<option>IRANSans</option>
<option>Vazir</option>
<option>Yekan</option>
<option>Ray</option>
</select>
</div>

<!-- COLORS -->
<div class="section" id="colors">
<h3>Colors</h3>

<label>Background</label>
<input id="bgColor" type="color">

<label>Title Color</label>
<input id="titleColor" type="color">

<label>Subtitle Color</label>
<input id="subtitleColor" type="color">
</div>

<!-- ANIMATION -->
<div class="section" id="animation">
<h3>Transition</h3>

<select id="transition">
<option value="fade">Fade</option>
<option value="slide">Slide</option>
<option value="zoom">Zoom</option>
</select>
</div>

</div>

<!-- PREVIEW -->
<div class="preview">
<iframe src="index.html"></iframe>
</div>

</div>

<script src="admin.js"></script>
</body>
</html>
