<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="panel">

<input id="width" type="number" value="1200">
<input id="height" type="number" value="200">

<input id="bg" type="color" value="#1a1a1a">

<input id="logo" placeholder="Logo URL">

<input id="title" placeholder="عنوان">

<input id="desc" placeholder="توضیحات">

<input id="titleColor" type="color" value="#ffffff">
<input id="descColor" type="color" value="#dddddd">

<input id="titleSize" type="number" value="52">
<input id="descSize" type="number" value="24">

<select id="font">
<option>Tahoma</option>
<option>Arial</option>
<option>Verdana</option>
<option>Georgia</option>
</select>

<select id="effect">
<option value="fade">Fade</option>
<option value="slide">Slide</option>
<option value="zoom">Zoom</option>
</select>

<button onclick="save()">Apply</button>

</div>

<script src="admin.js"></script>

</body>
</html>
