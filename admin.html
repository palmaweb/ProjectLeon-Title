<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت</title>

<style>

body{

    background:#111;
    color:white;

    font-family:tahoma;

    padding:40px;

    direction:rtl;
}

input{

    width:100%;

    padding:16px;

    margin-bottom:20px;

    border:none;

    border-radius:12px;

    font-size:20px;
}

label{

    display:block;

    margin-bottom:10px;

    font-size:20px;
}

button{

    background:#e10000;

    color:white;

    border:none;

    padding:16px 45px;

    font-size:22px;

    border-radius:14px;

    cursor:pointer;
}

</style>

</head>
<body>

<h1>پنل مدیریت Overlay</h1>

<input type="text" id="title" placeholder="تیتر اصلی">

<input type="text" id="subtitle" placeholder="زیر تیتر">

<label>رنگ پنل</label>
<input type="color" id="panelColor">

<label>رنگ باکس سمت چپ</label>
<input type="color" id="leftColor">

<button onclick="saveData()">ذخیره</button>

<script src="admin.js"></script>

</html>
