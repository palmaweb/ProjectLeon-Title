<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="assets/fonts/fonts.css">

<title>Broadcast Display</title>

<style>

body{
  margin:0;
  overflow:hidden;
  background:transparent;
  font-family: Vazirmatn, IRANYekanX, IRANSansX;
}

/* =========================
   MAIN WRAPPER
========================= */
.container{
  position:fixed;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  border-radius:16px;
  overflow:hidden;
  align-items:stretch;
  width:fit-content;
  isolation:isolate;
}

/* =========================
   RGB BORDER (OUTER GLOW)
========================= */
.container::before{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius:20px;
  background:linear-gradient(
    90deg,
    #ff0000,#ff9900,#ffee00,#00ff00,
    #00ffff,#0066ff,#aa00ff,#ff0066,#ff0000
  );
  background-size:400% 400%;
  animation:rgbBorder 8s linear infinite;
  z-index:-1;

  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;

  pointer-events:none;
}

@keyframes rgbBorder{
  0%{background-position:0% 50%}
  100%{background-position:400% 50%}
}

/* =========================
   BACKGROUND (ONLY THIS OPACITY)
========================= */
.bg-layer{
  position:absolute;
  inset:0;
  z-index:0;
  background:rgba(0,0,0,0.6);
}

/* =========================
   CONTENT LAYER (NO OPACITY IMPACT)
========================= */
.content-layer{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:row;
  align-items:stretch;
}

/* =========================
   LOGO PANEL
========================= */
.logo{
  width:200px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:10px;
  box-sizing:border-box;
  background:rgba(0,0,0,0.15);
  backdrop-filter:blur(8px);
}

.logo img{
  width:120px;
  height:120px;
  object-fit:contain;
  display:none;
}

/* =========================
   CLOCK
========================= */
.clock{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#fff;
  margin-top:auto;
}

.clock-country{
  font-size:14px;
  opacity:0.8;
}

.clock-time{
  font-size:22px;
  font-weight:700;
}

/* =========================
   TEXT AREA
========================= */
.content{
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-width:500px;
  padding:0 60px;
  box-sizing:border-box;
  text-align:center;
}

.title{
  font-size:28px;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.subtitle{
  font-size:18px;
  color:#ddd;
  opacity:0.9;
  margin-top:6px;
}

/* =========================
   STATUS ICON
========================= */
.statusBox{
  width:100px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.1);
}

.statusIcon{
  width:90px;
  height:90px;
  object-fit:contain;
  display:none;
}

/* =========================
   ANIMATIONS
========================= */
.fade{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

</style>
</head>

<body>

<div class="container" id="box">

  <!-- BACKGROUND ONLY -->
  <div class="bg-layer" id="bg"></div>

  <div class="content-layer">

    <!-- LOGO -->
    <div class="logo">
      <img id="logoImg">
      <div class="clock" id="clock"></div>
    </div>

    <!-- TEXT -->
    <div class="content">
      <div class="title" id="titleText"></div>
      <div class="subtitle" id="subtitleText"></div>
    </div>

    <!-- ICON -->
    <div class="statusBox">
      <img id="iconImg" class="statusIcon">
    </div>

  </div>
</div>

<script>

const STORAGE_KEY = "broadcast_settings";

let state = {};
let index = 0;

const zones = [
  {name:"ایران", timezone:"Asia/Tehran"},
  {name:"اروپا", timezone:"Europe/Berlin"},
  {name:"آمریکا", timezone:"America/New_York"},
  {name:"اسرائیل", timezone:"Asia/Jerusalem"}
];

function load(){
  state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  apply();
}

function apply(){

  const box = document.getElementById("box");
  const bg = document.getElementById("bg");

  /* SIZE */
  if(state.container){
    box.style.width = (state.container.width || 900) + "px";
    box.style.height = (state.container.height || 180) + "px";

    /* مهم: فقط بک‌گراند شفاف می‌شود */
    bg.style.background = `rgba(0,0,0,${state.container.opacity ?? 0.6})`;
  }

  /* LOGO */
  const logo = document.getElementById("logoImg");
  if(state.logo?.url){
    logo.src = state.logo.url;
    logo.style.display = "block";
  } else {
    logo.style.display = "none";
  }

  /* TITLE */
  const title = document.getElementById("titleText");
  if(state.title){
    title.innerText = state.title.text || "";
    title.style.fontSize = (state.title.size || 28) + "px";
    title.style.color = state.title.color || "#fff";
    title.style.fontWeight = state.title.weight || 700;
  }

  /* SUBTITLE */
  const sub = document.getElementById("subtitleText");
  if(state.subtitle){
    sub.innerText = state.subtitle.text || "";
    sub.style.fontSize = (state.subtitle.size || 18) + "px";
    sub.style.color = state.subtitle.color || "#ddd";
  }

  /* ICON */
  const icon = document.getElementById("iconImg");
  if(state.icon && state.icon.type !== "off"){
    icon.style.display = "block";

    if(state.icon.type === "custom") icon.src = state.icon.url;
    if(state.icon.type === "live") icon.src = "https://upload.wikimedia.org/wikipedia/commons/4/4f/Red_circle.gif";

    icon.style.width = (state.icon.size || 90) + "px";
    icon.style.height = (state.icon.size || 90) + "px";

  } else {
    icon.style.display = "none";
  }

  /* CLOCK */
  if(state.clock?.enabled){
    startClock();
  } else {
    stopClock();
  }

  box.classList.add("fade");
  setTimeout(()=>box.classList.remove("fade"),400);
}

function startClock(){

  stopClock();

  const el = document.getElementById("clock");

  setInterval(()=>{

    const z = zones[index % zones.length];

    const time = new Date().toLocaleTimeString("fa-IR",{
      timeZone:z.timezone,
      hour:"2-digit",
      minute:"2-digit",
      hour12:false
    });

    el.innerHTML = `
      <div class="clock-country">${z.name}</div>
      <div class="clock-time">${time}</div>
    `;

    index++;

  }, (state.clock?.interval || 10) * 1000);
}

function stopClock(){
  document.getElementById("clock").innerHTML = "";
}

window.addEventListener("storage", load);
window.addEventListener("broadcast_update", load);

load();

</script>

</body>
</html>
