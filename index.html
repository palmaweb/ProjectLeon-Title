<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Viewer</title>
  <style>
    body { margin:0; background:#111; }
    .box{
      position:absolute;
      bottom:50px;
      left:50%;
      transform:translateX(-50%);
      width:1200px;
      height:150px;
      background:#000;
      color:#fff;
      display:flex;
      align-items:center;
      padding:15px;
      box-sizing:border-box;
      border-left:6px solid red;
      font-family:tahoma;
    }
    .logo img, .icon img { width:60px; height:60px; }
    .text{ flex:1; padding:0 15px; }
    .t1{ font-size:26px; font-weight:bold; }
    .t2{ font-size:14px; opacity:0.8; }
    .panel {
  background: #1e1e1e;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.2s;
}

/* SAVE BUTTON */
#saveBtn {
  background: linear-gradient(90deg, #00c853, #64dd17);
  color: #000;
}

#saveBtn:hover {
  transform: scale(1.02);
  filter: brightness(1.1);
}

/* RESET BUTTON */
#resetBtn {
  background: linear-gradient(90deg, #ff1744, #d50000);
  color: #fff;
}

#resetBtn:hover {
  transform: scale(1.02);
  filter: brightness(1.1);
}

/* STATUS TEXT */
#status {
  margin-top: 10px;
  font-size: 14px;
  text-align: center;
  opacity: 0.9;
  min-height: 20px;
  transition: 0.2s;
}
  </style>
</head>

<body>

<div class="box">
  <div class="logo"><img id="logo"></div>
  <div class="text">
    <div class="t1" id="t1"></div>
    <div class="t2" id="t2"></div>
  </div>
  <div class="icon"><img id="icon"></div>
</div>

<script src="app.js"></script>

</body>
</html>
