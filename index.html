<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display</title>

<style>
body{margin:0;background:transparent;font-family:Vazirmatn;}

.container{
  position:fixed;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  border-radius:16px;
  overflow:hidden;
}

/* only background opacity */
.bg{
  position:absolute;
  inset:0;
  z-index:0;
}

.content{
  position:relative;
  z-index:2;
  display:flex;
}

.logo{
  width:90px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.logo img{
  width:55px;
  display:none;
}

.clock{font-size:12px;color:white;}

.text{
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  min-width:500px;
}

.titleRow{
  display:flex;
  justify-content:center;
  gap:10px;
}

.icon{
  width:20px;
  display:none;
}
</style>

</head>

<body>

<div class="container" id="box">

<div class="bg" id="bg"></div>

<div class="content">

  <div class="logo">
    <img id="logoImg">
    <div class="clock" id="clock">--:--</div>
  </div>

  <div class="text">

    <div class="titleRow">
      <div id="title"></div>
      <img id="icon" class="icon">
    </div>

    <div id="sub"></div>

  </div>

</div>

</div>

<script>

const KEY="broadcast_settings";
let state={};
let i=0;

const zones=[
 {n:"IR",o:3.5},
 {n:"EU",o:1},
 {n:"US",o:-5},
 {n:"IL",o:2}
];

function load(){
 state=JSON.parse(localStorage.getItem(KEY))||{};
 apply();
}

function apply(){

 const box=document.getElementById("box");
 const bg=document.getElementById("bg");

 /* container */
 if(state.container){
   box.style.width=state.container.width+"px";
   box.style.height=state.container.height+"px";
   bg.style.background=state.container.bgColor;
   bg.style.opacity=state.container.opacity;
 }

 /* logo SAFE */
 const logo=document.getElementById("logoImg");
 if(state.logo?.url){
   logo.src=state.logo.url;
   logo.style.display="block";
   logo.style.width=(state.logo.size||55)+"px";
 } else logo.style.display="none";

 /* title */
 document.getElementById("title").innerText=state.title?.text||"";
 document.getElementById("sub").innerText=state.subtitle?.text||"";

 /* icon SAFE */
 const icon=document.getElementById("icon");
 if(state.icon?.type!=="off"){
   icon.style.display="block";
   if(state.icon.type==="custom") icon.src=state.icon.url;
   if(state.icon.type==="live") icon.src="https://upload.wikimedia.org/wikipedia/commons/4/4f/Red_circle.gif";
 } else icon.style.display="none";

 startClock();
}

let timer;
function startClock(){
 if(timer) clearInterval(timer);

 const interval=(state.clock?.interval||10)*1000;

 timer=setInterval(()=>{

  const z=zones[i%zones.length];
  const now=new Date();
  const utc=now.getTime()+now.getTimezoneOffset()*60000;
  const d=new Date(utc+3600000*z.o);

  document.getElementById("clock").innerText=
  z.n+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");

  i++;

 },interval);
}

window.addEventListener("storage",load);
window.addEventListener("broadcast_update",load);

load();

</script>

</body>
</html>
