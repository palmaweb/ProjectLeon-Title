<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="assets/fonts/fonts.css">

<title>Broadcast Display</title>

<style>

body{
  margin:0;
  background:transparent;
  overflow:hidden;
  font-family:Vazirmatn,IRANYekanX,IRANSansX,sans-serif;
}

.container{
  position:fixed;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  border-radius:16px;
  overflow:hidden;
  align-items:stretch;
  z-index:1;
  background:transparent;
  width:auto;
  min-width:900px;
  isolation:isolate;
}

.bg-layer{
  position:absolute;
  inset:0;
  z-index:0;
}

.content-layer{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:row;
  align-items:stretch;
  width:100%;
  height:100%;
  direction:ltr;
}

.logo{
  order:1;
  width:200px;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;

  background:rgba(0,0,0,0.2);

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);

  overflow:hidden;
}

.logo img{
  width:130px;
  height:130px;
  object-fit:contain;
  display:none;
  flex-shrink:0;
}

.clock{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  margin-top:auto;
  margin-bottom:8px;
  line-height:1.0;
  color:#fff;
  text-align:center;
}

.clock-country{
  font-size:24px;
  opacity:0.8;
  white-space:nowrap;
  margin-bottom:4px;
  font-weight:800;
}

.clock-time{
  font-size:24px;
  font-weight:800;
  white-space:nowrap;
  line-height:1;
}

.content{
  order:2;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  min-width:500px;
  gap:20px;
  flex:1;
  overflow:hidden;
}

.text{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  width:100%;
  max-width:1000px;
  padding:0 80px;
  margin:0 auto;
  gap:10px;
  direction:rtl;
}

.title{
  font-size:28px;
  color:#fff;
  text-align:center;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  width:100%;
}

.subtitle{
  font-size:18px;
  color:#ddd;
  opacity:0.9;
  text-align:center;

  display:-webkit-box;
  -webkit-line-clamp:1;
  -webkit-box-orient:vertical;

  overflow:hidden;
  margin-top:2px;
  margin-bottom:10px;
  width:100%;
}

.statusBox{
  width:100px;
  height:100%;
  margin-right:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.statusIcon{
  width:200px;
  height:200px;
  object-fit:contain;
  display:none;
}

.fade{animation:fadeIn .5s ease;}
.slide{animation:slideIn .5s ease;}
.zoom{animation:zoomIn .5s ease;}
.glitch{animation:glitch .4s infinite;}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

@keyframes slideIn{
  from{
    transform:translateX(-50%) translateY(20px);
    opacity:0;
  }
  to{
    transform:translateX(-50%) translateY(0);
    opacity:1;
  }
}

@keyframes zoomIn{
  from{
    transform:translateX(-50%) scale(.95);
    opacity:0;
  }
  to{
    transform:translateX(-50%) scale(1);
    opacity:1;
  }
}

</style>
</head>

<body>

<div class="container" id="box">

  <div class="bg-layer" id="bg"></div>

  <div class="content-layer">

    <div class="logo">
      <img id="logoImg">
      <div class="clock" id="clock"></div>
    </div>

    <div class="content">
      <div class="text">
        <div class="title" id="titleText"></div>
        <div class="subtitle" id="subtitleText"></div>
      </div>
    </div>

    <div class="statusBox" id="statusBox">
      <img id="iconImg" class="statusIcon">
    </div>

  </div>
</div>

<script>

const STORAGE_KEY = "broadcast_settings";

let state = {};
let lastState = "";

/* =========================
   LOAD
========================= */

function load(){

  try{

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if(!saved) return;

    if(saved === lastState) return;

    lastState = saved;

    state = JSON.parse(saved);

    apply();

  }catch(err){

    console.error(err);

  }

}

/* =========================
   APPLY
========================= */

function apply(){

  const box =
    document.getElementById("box");

  const bg =
    document.getElementById("bg");

  const container =
    state.container || {};

  box.style.width =
    (container.width || 900) + "px";

  box.style.height =
    (container.height || 180) + "px";

  bg.style.background =
    container.bgColor || "#000";

  bg.style.opacity =
    container.opacity ?? 0.5;

  /* TITLE */

  const title =
    document.getElementById("titleText");

  title.innerText =
    state.title?.text || "";

  title.style.fontSize =
    (state.title?.size || 28) + "px";

  title.style.color =
    state.title?.color || "#fff";

  title.style.fontWeight =
    state.title?.weight || 700;

  title.style.fontFamily =
    state.title?.font || "Vazirmatn";

  /* SUBTITLE */

  const sub =
    document.getElementById("subtitleText");

  sub.innerText =
    state.subtitle?.text || "";

  sub.style.fontSize =
    (state.subtitle?.size || 18) + "px";

  sub.style.color =
    state.subtitle?.color || "#ddd";

  sub.style.fontWeight =
    state.subtitle?.weight || 400;

  sub.style.fontFamily =
    state.subtitle?.font || "Vazirmatn";

  /* LOGO */

  const logo =
    document.getElementById("logoImg");

  if(state.logo?.url){

    logo.src = state.logo.url;
    logo.style.display = "block";

  }else{

    logo.style.display = "none";
  }

  /* ICON */

  const icon =
    document.getElementById("iconImg");

  const statusBox =
    document.getElementById("statusBox");

  statusBox.style.order =
    state.icon?.position === "left"
      ? 0
      : 3;

  if(state.icon?.type &&
     state.icon.type !== "off"){

    icon.style.display = "block";

    if(state.icon.type === "custom")
      icon.src = state.icon.url;

    if(state.icon.type === "live")
      icon.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Live_icon.svg/512px-Live_icon.svg.png";

    if(state.icon.type === "breaking")
      icon.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Breaking_News.svg/512px-Breaking_News.svg.png";

    if(state.icon.type === "alert")
      icon.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/OOjs_UI_icon_alert-destructive.svg/512px-OOjs_UI_icon_alert-destructive.svg.png";

    icon.style.width =
      (state.icon.size || 100) + "px";

    icon.style.height =
      (state.icon.size || 100) + "px";

  }else{

    icon.style.display = "none";
  }

  applyTransition();

  updateClock();
}

/* =========================
   TRANSITION
========================= */

function applyTransition(){

  const type =
    state.transition?.type || "fade";

  const duration =
    state.transition?.duration || 500;

  const box =
    document.getElementById("box");

  box.classList.remove(
    "fade",
    "slide",
    "zoom",
    "glitch"
  );

  void box.offsetWidth;

  box.style.animationDuration =
    duration + "ms";

  box.classList.add(type);
}

/* =========================
   CLOCK
========================= */

function updateClock(){

  const clock =
    document.getElementById("clock");

  if(!state.clock?.enabled){

    clock.style.display = "none";
    return;
  }

  clock.style.display = "flex";

  const zoneMap = {
    iran:{
      name:"ایران",
      tz:"Asia/Tehran"
    },
    usa:{
      name:"آمریکا",
      tz:"America/New_York"
    },
    europe:{
      name:"اروپا",
      tz:"Europe/Berlin"
    },
    israel:{
      name:"اسرائیل",
      tz:"Asia/Jerusalem"
    }
  };

  const mode =
    state.clock?.mode || "iran";

  let selected =
    zoneMap[mode] || zoneMap.iran;

  const time =
    new Date().toLocaleTimeString(
      "fa-IR",
      {
        timeZone:selected.tz,
        hour:"2-digit",
        minute:"2-digit",
        hour12:false
      }
    );

  clock.innerHTML = `
    <div class="clock-country"
      style="
        font-size:${state.clock?.countrySize || 18}px
      ">
      ${selected.name}
    </div>

    <div class="clock-time"
      style="
        font-size:${state.clock?.timeSize || 24}px
      ">
      ${time}
    </div>
  `;
}

/* =========================
   REALTIME LOOP
========================= */

setInterval(load,150);

load();

</script>

</body>
</html>
