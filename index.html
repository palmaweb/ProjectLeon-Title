<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broadcast Display</title>

  <style>
    body{
      margin:0;
      background:transparent;
      overflow:hidden;
      font-family: Vazirmatn, sans-serif;
    }

    /* OUTER WRAPPER */
    .container{
    position:fixed;
    bottom:60px;
    left:50%;
    transform:translateX(-50%);

    display:flex;

    border-radius:16px;
    overflow:hidden;

    align-items:stretch;
  }

    /* BACKGROUND LAYER (ONLY THIS GETS OPACITY) */
    .bg-layer{
      position:absolute;
      inset:0;
      z-index:0;
    }

    /* CONTENT LAYER (NO OPACITY AFFECT) */
    .content-layer{
    position:relative;
    z-index:2;

    display:flex;
  
    align-items:stretch;
  }

    /* LOGO */
    .logo{
    width:200px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    background:rgba(0,0,0,0.2);
    padding:12px 10px;
    box-sizing:border-box;
  }

.logo img{
  width:130px;
  height:130px;
  object-fit:contain;
  display:none;
  flex-shrink:0;
}

.clock{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#fff;
  opacity:0.9;
  line-height:1.2;
  margin-top:auto;
  margin-bottom:15px;
  flex-shrink:0;
}

    /* TEXT AREA CENTERED */
    .content{
    display:flex;
    flex-direction:column;
    justify-content:center;
    text-align:center;
    min-width:500px;
     gap:20px;
  }
    .content-layer{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    flex-direction:row;
  }
    .logo{
    order:1;
  }

  .content{
    order:2;
  }

    /* TITLE ROW */
    .titleRow{
    display:flex;
    justify-content:center;
    gap:10px;
  }
  .text{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  width:100%;
  max-width:600px;   /* 👈 کنترل واقعی عرض */
  padding:0 20px;    /* فاصله امن از لوگو */
  box-sizing:border-box;
  margin:0 auto;     /* وسط واقعی */
}

    .icon{
      width:22px;
      height:22px;
      display:none;
    }

    .title{
      font-size:28px;
      color:#fff;
      text-align:center;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      width:100%;
    }

    .subtitle{
      font-size:18px;
      color:#ddd;
      opacity:0.9;
      text-align:center;
      display:-webkit-box;
      -webkit-line-clamp:1;
      -webkit-box-orient:vertical;
      overflow:hidden;
      margin-top:2px;
      width:100%;
    }

    /* SIMPLE ANIMATION */
    .fade{
      animation:fadeIn 0.4s ease;
    }

    @keyframes fadeIn{
      from{opacity:0; transform:translateY(10px)}
      to{opacity:1; transform:translateY(0)}
    }

  </style>
</head>
<body>

<div class="container" id="box">

  <!-- BACKGROUND LAYER -->
  <div class="bg-layer" id="bg"></div>

  <!-- CONTENT -->
  <div class="content-layer">

    <!-- LOGO -->
    <div class="logo">
      <img id="logoImg">
      <div class="clock" id="clock">--:--</div>
    </div>

    <!-- TEXT -->
    <div class="content">

      <div class="text">
        <div class="title" id="titleText"></div>
        <img id="iconImg" class="icon">
      </div>

      <div class="subtitle" id="subtitleText"></div>

    </div>

  </div>
</div>

<script>

const STORAGE_KEY = "broadcast_settings";
let state = {};
let clockIndex = 0;

const zones = [
  {name:"Iran", offset:3.5},
  {name:"Europe", offset:1},
  {name:"USA", offset:-5},
  {name:"Israel", offset:2}
];

function load(){
  state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  apply();
}

function apply(){

  const box = document.getElementById("box");
  const bg = document.getElementById("bg");

  /* CONTAINER SIZE */
  if(state.container){
    box.style.width = state.container.width + "px";
    box.style.height = state.container.height + "px";
  }

  /* BACKGROUND ONLY OPACITY */
  if(state.container){
    bg.style.background = state.container.bgColor || "rgba(0,0,0,0.5)";
    bg.style.opacity = state.container.opacity;
  }

  /* LOGO SAFE */
  const logo = document.getElementById("logoImg");
  if(state.logo?.url){
    logo.src = state.logo.url;
    logo.style.display = "block";
  } else {
    logo.style.display = "none";
  }

  /* TITLE */
  const title = document.getElementById("titleText");
  if(state.title){
    title.innerText = state.title.text || "";
    title.style.fontSize = (state.title.size || 28) + "px";
    title.style.color = state.title.color || "#fff";
    title.style.fontWeight = state.title.weight || 700;
  }

  /* SUBTITLE */
  const sub = document.getElementById("subtitleText");
  if(state.subtitle){
    sub.innerText = state.subtitle.text || "";
    sub.style.fontSize = (state.subtitle.size || 18) + "px";
    sub.style.color = state.subtitle.color || "#ddd";
  }

  /* ICON SAFE */
  const icon = document.getElementById("iconImg");
  if(state.icon && state.icon.type !== "off"){

    icon.style.display = "block";

    if(state.icon.type === "custom" && state.icon.url){
      icon.src = state.icon.url;
    }

    if(state.icon.type === "live") icon.src = "https://upload.wikimedia.org/wikipedia/commons/4/4f/Red_circle.gif";
    if(state.icon.type === "breaking") icon.src = "https://upload.wikimedia.org/wikipedia/commons/3/3b/Red_pog.svg";
    if(state.icon.type === "alert") icon.src = "https://upload.wikimedia.org/wikipedia/commons/5/5f/Red_warning_icon.svg";

    icon.style.width = (state.icon.size || 22) + "px";

  } else {
    icon.style.display = "none";
  }

  /* CLOCK */
  if(state.clock?.enabled){
    startClock();
  }

  box.classList.add("fade");
  setTimeout(()=>box.classList.remove("fade"),400);
}

function startClock(){

  const interval = (state.clock?.interval || 10) * 1000;

  setInterval(()=>{

    const zone = zones[clockIndex % zones.length];

    const now = new Date();
    const utc = now.getTime() + now.getTimezoneOffset()*60000;
    const local = new Date(utc + (3600000 * zone.offset));

    const hh = String(local.getHours()).padStart(2,"0");
    const mm = String(local.getMinutes()).padStart(2,"0");

    document.getElementById("clock").innerText = hh + ":" + mm;

    clockIndex++;

  }, interval);
}

window.addEventListener("storage", load);
window.addEventListener("broadcast_update", load);

load();

</script>

</body>
</html>
