<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Display</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#111; /* مهم: جلوگیری از سفید شدن */
    font-family:sans-serif;
}

/* BOX */
.container{
    position:fixed;
    bottom:60px;
    left:50%;
    transform:translateX(-50%);
    width:900px;
    height:180px;
    display:flex;
    border-radius:12px;
    overflow:hidden;
}

/* BACKGROUND (ONLY HERE OPACITY) */
.bg{
    position:absolute;
    inset:0;
    background:#000;
    opacity:0.6;
}

/* LAYOUT */
.content{
    position:relative;
    z-index:2;
    display:flex;
    width:100%;
    height:100%;
}

/* LOGO */
.logo{
    width:180px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(255,255,255,0.05);
}

.logo img{
    width:100px;
    height:100px;
    display:none;
}

/* TEXT */
.center{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    text-align:center;
    color:#fff;
}

.title{
    font-size:28px;
}

.subtitle{
    font-size:16px;
    opacity:0.8;
}

/* ICON */
.icon{
    width:120px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.icon img{
    width:80px;
    height:80px;
    display:none;
}

.clock{
    font-size:14px;
    margin-top:8px;
    opacity:0.8;
}

</style>
</head>

<body>

<div class="container">

    <div class="bg"></div>

    <div class="content">

        <div class="logo">
            <img id="logo">
            <div class="clock" id="clock"></div>
        </div>

        <div class="center">
            <div class="title" id="title">Test Title</div>
            <div class="subtitle" id="sub">Test Subtitle</div>
        </div>

        <div class="icon">
            <img id="icon">
        </div>

    </div>

</div>

<script>

let state = JSON.parse(localStorage.getItem("broadcast_settings") || "{}");

/* SAFE RENDER */
function render(){

    try{

        /* TITLE */
        document.getElementById("title").innerText =
            (state.title && state.title.text) || "LIVE NEWS";

        /* SUB */
        document.getElementById("sub").innerText =
            (state.subtitle && state.subtitle.text) || "";

        /* LOGO */
        const logo = document.getElementById("logo");

        if(state.logo && state.logo.url){
            logo.src = state.logo.url;
            logo.style.display = "block";
        }

        /* ICON */
        const icon = document.getElementById("icon");

        if(state.icon && state.icon.type !== "off"){

            icon.style.display = "block";

            if(state.icon.type === "live")
                icon.src = "https://static.vecteezy.com/system/resources/previews/023/456/825/non_2x/red-live-button-icon-for-tv-and-streaming-on-a-transparent-background-free-png.png";

            else if(state.icon.type === "breaking")
                icon.src = "https://static.vecteezy.com/system/resources/thumbnails/008/506/377/small/breaking-news-red-3d-text-free-png.png";

            else if(state.icon.type === "alert")
                icon.src = "https://uxwing.com/wp-content/themes/uxwing/download/signs-and-symbols/red-alert-icon.png";

            else if(state.icon.type === "custom")
                icon.src = state.icon.url || "";
        }

        /* CLOCK */
        updateClock();

    }catch(e){
        console.log("Render error:", e);
    }
}

/* CLOCK SAFE */
function updateClock(){

    try{

        const zones = [
            {n:"IR",t:"Asia/Tehran"},
            {n:"EU",t:"Europe/Berlin"},
            {n:"US",t:"America/New_York"}
        ];

        const z = zones[Math.floor(Date.now()/10000)%zones.length];

        const time = new Date().toLocaleTimeString("fa-IR",{
            timeZone:z.t,
            hour:"2-digit",
            minute:"2-digit",
            hour12:false
        });

        document.getElementById("clock").innerHTML =
            z.n + " | " + time;

    }catch(e){
        console.log("Clock error:", e);
    }
}

/* INIT */
render();
setInterval(updateClock, 1000);

/* LIVE UPDATE */
window.addEventListener("storage", () => {
    state = JSON.parse(localStorage.getItem("broadcast_settings") || "{}");
    render();
});

</script>

</body>
</html>
