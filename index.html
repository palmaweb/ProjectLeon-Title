<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Admin Panel + Live Preview</title>

<style>
    body {
        margin: 0;
        font-family: sans-serif;
        direction: rtl;
        background: #f4f4f4;
    }

    /* بخش پیش نمایش بالا */
    .preview {
        height: 45vh;
        background: white;
        border-bottom: 2px solid #ddd;
        padding: 20px;
        box-sizing: border-box;
        overflow: auto;
    }

    .preview h1 {
        margin: 0;
        color: #222;
    }

    .preview p {
        font-size: 16px;
        color: #555;
        line-height: 1.8;
    }

    /* پنل ادمین پایین */
    .admin {
        height: 55vh;
        padding: 20px;
        box-sizing: border-box;
        background: #1e1e2f;
        color: white;
    }

    .admin h2 {
        margin-top: 0;
    }

    input, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        margin-bottom: 15px;
        border-radius: 6px;
        border: none;
        outline: none;
        font-size: 14px;
    }

    textarea {
        height: 120px;
        resize: none;
    }

    label {
        font-size: 14px;
        color: #ccc;
    }

    .box {
        max-width: 800px;
        margin: auto;
    }
</style>
</head>

<body>

<!-- PREVIEW -->
<div class="preview">
    <h1 id="titlePreview">عنوان پیش‌فرض</h1>
    <p id="textPreview">این یک متن نمونه برای پیش‌نمایش است...</p>
</div>

<!-- ADMIN PANEL -->
<div class="admin">
    <div class="box">
        <h2>پنل مدیریت</h2>

        <label>عنوان</label>
        <input type="text" id="titleInput" placeholder="عنوان را وارد کنید">

        <label>متن</label>
        <textarea id="textInput" placeholder="متن را وارد کنید"></textarea>
    </div>
</div>

<script>
    const titleInput = document.getElementById("titleInput");
    const textInput = document.getElementById("textInput");

    const titlePreview = document.getElementById("titlePreview");
    const textPreview = document.getElementById("textPreview");

    // آپدیت زنده عنوان
    titleInput.addEventListener("input", function () {
        titlePreview.textContent = this.value || "عنوان پیش‌فرض";
    });

    // آپدیت زنده متن
    textInput.addEventListener("input", function () {
        textPreview.textContent = this.value || "این یک متن نمونه برای پیش‌نمایش است...";
    });
</script>

</body>
</html>
