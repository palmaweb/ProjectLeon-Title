<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broadcast Display</title>

<link rel="stylesheet" href="assets/fonts/fonts.css">

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:Vazirmatn,IRANYekanX,IRANSansX,sans-serif;
}

.container{
  position:fixed;
  left:50%;
  bottom:60px;
  transform:translateX(-50%);

  width:1000px;
  height:180px;

  border-radius:18px;
  overflow:hidden;

  display:flex;

  z-index:999;

  isolation:isolate;
}

.bg{
  position:absolute;
  inset:0;
  background:#000;
  opacity:.5;
  z-index:0;
}

.inner{
  position:relative;
  z-index:2;

  display:flex;
  width:100%;
  height:100%;

  direction:ltr;
}

.logoArea{
  width:210px;
  min-width:210px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;

  background:rgba(0,0,0,.18);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  overflow:hidden;
}

.logoArea img{
  width:130px;
  height:130px;
  object-fit:contain;
  margin-top:8px;
  display:none;
}

.clock{
  width:100%;
  text-align:center;
  color:#fff;
  padding-bottom:10px;
}

.clock-country{
  font-weight:800;
  opacity:.85;
  margin-bottom:4px;
}

.clock-time{
  font-weight:900;
}

.content{
  flex:1;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.textWrap{
  width:100%;
  max-width:1100px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:10px;

  padding:0 70px;

  text-align:center;
  direction:rtl;
}

.title{
  width:100%;

  color:#fff;
  font-size:32px;
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.subtitle{
  width:100%;

  color:#ddd;
  font-size:18px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.iconArea{
  width:130px;
  min-width:130px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:10px;
}

.iconArea img{
  width:90px;
  height:90px;
  object-fit:contain;
  display:none;
}

.fade{
  animation:fadeAnim .5s ease;
}

.slide{
  animation:slideAnim .5s ease;
}

.zoom{
  animation:zoomAnim .5s ease;
}

@keyframes fadeAnim{
  from{opacity:0}
  to{opacity:1}
}

@keyframes slideAnim{
  from{
    opacity:0;
    transform:translateX(-50%) translateY(25px);
  }
  to{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
}

@keyframes zoomAnim{
  from{
    opacity:0;
    transform:translateX(-50%) scale(.95);
  }
  to{
    opacity:1;
    transform:translateX(-50%) scale(1);
  }
}

</style>
</head>
<body>

<div class="container fade" id="box">

  <div class="bg" id="bg"></div>

  <div class="inner">

    <div class="logoArea">
      <img id="logoImg">
      <div class="clock" id="clock"></div>
    </div>

    <div class="content">
      <div class="textWrap">
        <div class="title" id="title"></div>
        <div class="subtitle" id="subtitle"></div>
      </div>
    </div>

    <div class="iconArea" id="iconArea">
      <img id="iconImg">
    </div>

  </div>

</div>

<script>

const STORAGE_KEY = 'broadcast_overlay_state';

let state = {};
let lastRaw = '';

function defaultState(){

  return {

    title:{
      text:'Breaking News',
      size:32,
      color:'#ffffff',
      weight:800,
      font:'Vazirmatn'
    },

    subtitle:{
      text:'Subtitle Here',
      size:18,
      color:'#dddddd',
      weight:400,
      font:'Vazirmatn'
    },

    container:{
      width:1000,
      height:180,
      bgColor:'#000000',
      opacity:.5
    },

    logo:{
      url:''
    },

    icon:{
      type:'off',
      url:'',
      size:90,
      position:'right'
    },

    clock:{
      enabled:true,
      timezone:'Asia/Tehran',
      label:'ایران',
      countrySize:16,
      timeSize:24
    },

    transition:{
      type:'fade',
      duration:500
    }

  };
}

function load(){

  try{

    const raw = localStorage.getItem(STORAGE_KEY);

    if(!raw) return;

    if(raw === lastRaw) return;

    lastRaw = raw;

    state = JSON.parse(raw);

    apply();

  }catch(err){

    console.error(err);

  }
}

function apply(){

  const box = document.getElementById('box');
  const bg = document.getElementById('bg');

  box.style.width = state.container.width + 'px';
  box.style.height = state.container.height + 'px';

  bg.style.background = state.container.bgColor;
  bg.style.opacity = state.container.opacity;

  const title = document.getElementById('title');

  title.innerText = state.title.text;
  title.style.fontSize = state.title.size + 'px';
  title.style.color = state.title.color;
  title.style.fontWeight = state.title.weight;
  title.style.fontFamily = state.title.font;

  const subtitle = document.getElementById('subtitle');

  subtitle.innerText = state.subtitle.text;
  subtitle.style.fontSize = state.subtitle.size + 'px';
  subtitle.style.color = state.subtitle.color;
  subtitle.style.fontWeight = state.subtitle.weight;
  subtitle.style.fontFamily = state.subtitle.font;

  const logo = document.getElementById('logoImg');

  if(state.logo.url){

    logo.src = state.logo.url;
    logo.style.display = 'block';

  }else{

    logo.style.display = 'none';
  }

  const iconArea = document.getElementById('iconArea');
  const icon = document.getElementById('iconImg');

  iconArea.style.order =
    state.icon.position === 'left'
      ? 0
      : 3;

  if(state.icon.type === 'off'){

    icon.style.display = 'none';

  }else{

    icon.style.display = 'block';

    if(state.icon.type === 'custom'){
      icon.src = state.icon.url;
    }

    if(state.icon.type === 'live'){
      icon.src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Live_icon.svg/512px-Live_icon.svg.png';
    }

    if(state.icon.type === 'breaking'){
      icon.src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Breaking_News.svg/512px-Breaking_News.svg.png';
    }

    if(state.icon.type === 'alert'){
      icon.src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/OOjs_UI_icon_alert-destructive.svg/512px-OOjs_UI_icon_alert-destructive.svg.png';
    }

    icon.style.width = state.icon.size + 'px';
    icon.style.height = state.icon.size + 'px';
  }

  const clock = document.getElementById('clock');

  if(!state.clock.enabled){

    clock.style.display = 'none';

  }else{

    clock.style.display = 'block';

    const time = new Date().toLocaleTimeString('fa-IR',{
      timeZone:state.clock.timezone,
      hour:'2-digit',
      minute:'2-digit',
      hour12:false
    });

    clock.innerHTML = `
      <div class="clock-country"
        style="font-size:${state.clock.countrySize}px">
        ${state.clock.label}
      </div>

      <div class="clock-time"
        style="font-size:${state.clock.timeSize}px">
        ${time}
      </div>
    `;
  }

  applyTransition();
}

function applyTransition(){

  const box = document.getElementById('box');

  box.classList.remove('fade','slide','zoom');

  void box.offsetWidth;

  box.style.animationDuration =
    state.transition.duration + 'ms';

  box.classList.add(
    state.transition.type
  );
}

if(!localStorage.getItem(STORAGE_KEY)){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(defaultState())
  );
}

setInterval(load,120);
setInterval(apply,1000);

load();

</script>
</body>
</html>
