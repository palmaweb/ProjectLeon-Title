# broadcast-display.html

```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broadcast Display</title>

<link rel="stylesheet" href="assets/fonts/fonts.css">

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:Vazirmatn,IRANYekanX,IRANSansX,sans-serif;
}

.container{
  position:fixed;
  left:50%;
  bottom:60px;
  transform:translateX(-50%);

  width:1000px;
  height:180px;

  border-radius:18px;
  overflow:hidden;

  display:flex;

  z-index:999;

  isolation:isolate;
}

.bg{
  position:absolute;
  inset:0;
  background:#000;
  opacity:.5;
  z-index:0;
}

.inner{
  position:relative;
  z-index:2;

  display:flex;
  width:100%;
  height:100%;

  direction:ltr;
}

.logoArea{
  width:210px;
  min-width:210px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;

  background:rgba(0,0,0,.18);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  overflow:hidden;
}

.logoArea img{
  width:130px;
  height:130px;
  object-fit:contain;
  margin-top:8px;
  display:none;
}

.clock{
  width:100%;
  text-align:center;
  color:#fff;
  padding-bottom:10px;
}

.clock-country{
  font-weight:800;
  opacity:.85;
  margin-bottom:4px;
}

.clock-time{
  font-weight:900;
}

.content{
  flex:1;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.textWrap{
  width:100%;
  max-width:1100px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:10px;

  padding:0 70px;

  text-align:center;
  direction:rtl;
}

.title{
  width:100%;

  color:#fff;
  font-size:32px;
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.subtitle{
  width:100%;

  color:#ddd;
  font-size:18px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.iconArea{
  width:130px;
  min-width:130px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:10px;
}

.iconArea img{
  width:90px;
  height:90px;
  object-fit:contain;
  display:none;
}

.fade{
  animation:fadeAnim .5s ease;
}

.slide{
  animation:slideAnim .5s ease;
}

.zoom{
  animation:zoomAnim .5s ease;
}

@keyframes fadeAnim{
  from{opacity:0}
  to{opacity:1}
}

@keyframes slideAnim{
  from{
    opacity:0;
    transform:translateX(-50%) translateY(25px);
  }
  to{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
}

@keyframes zoomAnim{
  from{
    opacity:0;
    transform:translateX(-50%) scale(.95);
  }
  to{
    opacity:1;
    transform:translateX(-50%) scale(1);
  }
}

</style>
</head>
<body>

<div class="container fade" id="box">

  <div class="bg" id="bg"></div>

  <div class="inner">

    <div class="logoArea">
      <img id="logoImg">
      <div class="clock" id="clock"></div>
    </div>

    <div class="content">
      <div class="textWrap">
        <div class="title" id="title"></div>
        <div class="subtitle" id="subtitle"></div>
      </div>
    </div>

    <div class="iconArea" id="iconArea">
      <img id="iconImg">
    </div>

  </div>

</div>

<script>

const STORAGE_KEY = 'broadcast_overlay_state';

let state = {};
let lastRaw = '';

function defaultState(){

  return {

    title:{
      text:'Breaking News',
      size:32,
      color:'#ffffff',
      weight:800,
      font:'Vazirmatn'
    },

    subtitle:{
      text:'Subtitle Here',
      size:18,
      color:'#dddddd',
      weight:400,
      font:'Vazirmatn'
    },

    container:{
      width:1000,
      height:180,
      bgColor:'#000000',
      opacity:.5
    },

    logo:{
      url:''
    },

    icon:{
      type:'off',
      url:'',
      size:90,
      position:'right'
    },

    clock:{
      enabled:true,
      timezone:'Asia/Tehran',
      label:'ایران',
      countrySize:16,
      timeSize:24
    },

    transition:{
      type:'fade',
      duration:500
    }

  };
}

function load(){

  try{

    const raw = localStorage.getItem(STORAGE_KEY);

    if(!raw) return;

    if(raw === lastRaw) return;

    lastRaw = raw;

    state = JSON.parse(raw);

    apply();

  }catch(err){

    console.error(err);

  }
}

function apply(){

  const box = document.getElementById('box');
  const bg = document.getElementById('bg');

  box.style.width = state.container.width + 'px';
  box.style.height = state.container.height + 'px';

  bg.style.background = state.container.bgColor;
  bg.style.opacity = state.container.opacity;

  const title = document.getElementById('title');

  title.innerText = state.title.text;
  title.style.fontSize = state.title.size + 'px';
  title.style.color = state.title.color;
  title.style.fontWeight = state.title.weight;
  title.style.fontFamily = state.title.font;

  const subtitle = document.getElementById('subtitle');

  subtitle.innerText = state.subtitle.text;
  subtitle.style.fontSize = state.subtitle.size + 'px';
  subtitle.style.color = state.subtitle.color;
  subtitle.style.fontWeight = state.subtitle.weight;
  subtitle.style.fontFamily = state.subtitle.font;

  const logo = document.getElementById('logoImg');

  if(state.logo.url){

    logo.src = state.logo.url;
    logo.style.display = 'block';

  }else{

    logo.style.display = 'none';
  }

  const iconArea = document.getElementById('iconArea');
  const icon = document.getElementById('iconImg');

  iconArea.style.order =
    state.icon.position === 'left'
      ? 0
      : 3;

  if(state.icon.type === 'off'){

    icon.style.display = 'none';

  }else{

    icon.style.display = 'block';

    if(state.icon.type === 'custom'){
      icon.src = state.icon.url;
    }

    if(state.icon.type === 'live'){
      icon.src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Live_icon.svg/512px-Live_icon.svg.png';
    }

    if(state.icon.type === 'breaking'){
      icon.src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Breaking_News.svg/512px-Breaking_News.svg.png';
    }

    if(state.icon.type === 'alert'){
      icon.src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/OOjs_UI_icon_alert-destructive.svg/512px-OOjs_UI_icon_alert-destructive.svg.png';
    }

    icon.style.width = state.icon.size + 'px';
    icon.style.height = state.icon.size + 'px';
  }

  const clock = document.getElementById('clock');

  if(!state.clock.enabled){

    clock.style.display = 'none';

  }else{

    clock.style.display = 'block';

    const time = new Date().toLocaleTimeString('fa-IR',{
      timeZone:state.clock.timezone,
      hour:'2-digit',
      minute:'2-digit',
      hour12:false
    });

    clock.innerHTML = `
      <div class="clock-country"
        style="font-size:${state.clock.countrySize}px">
        ${state.clock.label}
      </div>

      <div class="clock-time"
        style="font-size:${state.clock.timeSize}px">
        ${time}
      </div>
    `;
  }

  applyTransition();
}

function applyTransition(){

  const box = document.getElementById('box');

  box.classList.remove('fade','slide','zoom');

  void box.offsetWidth;

  box.style.animationDuration =
    state.transition.duration + 'ms';

  box.classList.add(
    state.transition.type
  );
}

if(!localStorage.getItem(STORAGE_KEY)){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(defaultState())
  );
}

setInterval(load,120);
setInterval(apply,1000);

load();

</script>
</body>
</html>

# broadcast-admin.html

```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broadcast Admin</title>

<link rel="stylesheet" href="assets/fonts/fonts.css">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b1020;
  color:#fff;
  font-family:Vazirmatn,IRANYekanX,IRANSansX,sans-serif;

  display:flex;
  height:100vh;
}

.sidebar{
  width:320px;
  background:#121a2d;
  padding:16px;
  overflow-y:auto;
  border-left:1px solid rgba(255,255,255,.05);
}

.main{
  flex:1;
  overflow-y:auto;
  padding:20px;
}

h2{
  font-size:13px;
  color:#58a6ff;
  margin:10px 0;
}

.box{
  background:#151f36;
  border:1px solid rgba(255,255,255,.05);
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
}

label{
  display:block;
  margin-top:8px;
  margin-bottom:4px;
  font-size:11px;
  color:#a9b2c3;
}

input,select{
  width:100%;
  background:#0b1324;
  border:none;
  border-radius:10px;
  color:#fff;
  padding:10px;
  outline:none;
}

input[type='range']{
  padding:0;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button{
  width:100%;
  border:none;
  border-radius:12px;
  padding:12px;
  background:#2d7dff;
  color:#fff;
  cursor:pointer;
  font-weight:700;
  margin-top:12px;
}

</style>
</head>
<body>

<div class="sidebar">

  <h2>متن</h2>

  <div class="box">

    <label>تیتر</label>
    <input id="titleText">

    <label>سایز</label>
    <input type="range" min="10" max="80" id="titleSize">

    <label>رنگ</label>
    <input type="color" id="titleColor">

    <label>وزن</label>
    <select id="titleWeight">
      <option value="300">Light</option>
      <option value="400">Regular</option>
      <option value="700">Bold</option>
      <option value="800">ExtraBold</option>
    </select>

    <label>فونت</label>
    <select id="titleFont">
      <option>Vazirmatn</option>
      <option>IRANYekanX</option>
      <option>IRANSansX</option>
    </select>

  </div>

  <div class="box">

    <label>زیرتیتر</label>
    <input id="subText">

    <label>سایز</label>
    <input type="range" min="10" max="50" id="subSize">

    <label>رنگ</label>
    <input type="color" id="subColor">

    <label>وزن</label>
    <select id="subWeight">
      <option value="300">Light</option>
      <option value="400">Regular</option>
      <option value="700">Bold</option>
    </select>

    <label>فونت</label>
    <select id="subFont">
      <option>Vazirmatn</option>
      <option>IRANYekanX</option>
      <option>IRANSansX</option>
    </select>

  </div>

</div>

<div class="main">

  <h2>کادر</h2>

  <div class="box">

    <div class="grid">

      <div>
        <label>عرض</label>
        <input type="number" id="width">
      </div>

      <div>
        <label>ارتفاع</label>
        <input type="number" id="height">
      </div>

    </div>

    <label>رنگ</label>
    <input type="color" id="bgColor">

    <label>Opacity</label>
    <input type="range" min="0" max="1" step="0.05" id="opacity">

  </div>

  <h2>لوگو</h2>

  <div class="box">
    <label>URL</label>
    <input id="logoUrl">
  </div>

  <h2>آیکون</h2>

  <div class="box">

    <label>نوع</label>
    <select id="iconType">
      <option value="off">OFF</option>
      <option value="live">LIVE</option>
      <option value="breaking">BREAKING</option>
      <option value="alert">ALERT</option>
      <option value="custom">CUSTOM</option>
    </select>

    <label>URL</label>
    <input id="iconUrl">

    <label>اندازه</label>
    <input type="range" min="20" max="200" id="iconSize">

    <label>موقعیت</label>
    <select id="iconPosition">
      <option value="right">Right</option>
      <option value="left">Left</option>
    </select>

  </div>

  <h2>ساعت</h2>

  <div class="box">

    <label>فعال</label>
    <select id="clockEnabled">
      <option value="true">ON</option>
      <option value="false">OFF</option>
    </select>

    <label>کشور</label>
    <select id="clockZone">
      <option value="Asia/Tehran">Iran</option>
      <option value="Europe/Berlin">Europe</option>
      <option value="America/New_York">USA</option>
      <option value="Asia/Jerusalem">Israel</option>
    </select>

    <label>عنوان</label>
    <input id="clockLabel">

    <label>سایز نام کشور</label>
    <input type="range" min="10" max="40" id="countrySize">

    <label>سایز ساعت</label>
    <input type="range" min="10" max="60" id="timeSize">

  </div>

  <h2>ترنزیشن</h2>

  <div class="box">

    <label>نوع</label>
    <select id="transitionType">
      <option value="fade">Fade</option>
      <option value="slide">Slide</option>
      <option value="zoom">Zoom</option>
    </select>

    <label>مدت</label>
    <input type="range" min="100" max="3000" id="transitionDuration">

  </div>

</div>

<script>

const STORAGE_KEY = 'broadcast_overlay_state';

let state = JSON.parse(
  localStorage.getItem(STORAGE_KEY)
);

function save(){

  state.title.text = titleText.value;
  state.title.size = +titleSize.value;
  state.title.color = titleColor.value;
  state.title.weight = +titleWeight.value;
  state.title.font = titleFont.value;

  state.subtitle.text = subText.value;
  state.subtitle.size = +subSize.value;
  state.subtitle.color = subColor.value;
  state.subtitle.weight = +subWeight.value;
  state.subtitle.font = subFont.value;

  state.container.width = +width.value;
  state.container.height = +height.value;
  state.container.bgColor = bgColor.value;
  state.container.opacity = +opacity.value;

  state.logo.url = logoUrl.value;

  state.icon.type = iconType.value;
  state.icon.url = iconUrl.value;
  state.icon.size = +iconSize.value;
  state.icon.position = iconPosition.value;

  state.clock.enabled =
    clockEnabled.value === 'true';

  state.clock.timezone =
    clockZone.value;

  state.clock.label =
    clockLabel.value;

  state.clock.countrySize =
    +countrySize.value;

  state.clock.timeSize =
    +timeSize.value;

  state.transition.type =
    transitionType.value;

  state.transition.duration =
    +transitionDuration.value;

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );
}

function hydrate(){

  titleText.value = state.title.text;
  titleSize.value = state.title.size;
  titleColor.value = state.title.color;
  titleWeight.value = state.title.weight;
  titleFont.value = state.title.font;

  subText.value = state.subtitle.text;
  subSize.value = state.subtitle.size;
  subColor.value = state.subtitle.color;
  subWeight.value = state.subtitle.weight;
  subFont.value = state.subtitle.font;

  width.value = state.container.width;
  height.value = state.container.height;
  bgColor.value = state.container.bgColor;
  opacity.value = state.container.opacity;

  logoUrl.value = state.logo.url;

  iconType.value = state.icon.type;
  iconUrl.value = state.icon.url;
  iconSize.value = state.icon.size;
  iconPosition.value = state.icon.position;

  clockEnabled.value = String(state.clock.enabled);
  clockZone.value = state.clock.timezone;
  clockLabel.value = state.clock.label;
  countrySize.value = state.clock.countrySize;
  timeSize.value = state.clock.timeSize;

  transitionType.value = state.transition.type;
  transitionDuration.value = state.transition.duration;
}

hydrate();

[
  ...document.querySelectorAll('input'),
  ...document.querySelectorAll('select')
].forEach(el=>{

  el.addEventListener('input',save);
  el.addEventListener('change',save);

});

</script>
</body>
</html>
```
