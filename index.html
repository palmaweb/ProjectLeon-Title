<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Broadcast Display</title>

<link rel="stylesheet" href="assets/fonts/fonts.css">

<style>

body{
  margin:0;
  overflow:hidden;
  background:transparent;
  font-family: Vazirmatn, sans-serif;
}

/* MAIN CONTAINER */
.container{
  position:fixed;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:stretch;
  border-radius:16px;
  overflow:hidden;
  background:rgba(0,0,0,0.55);
  width:fit-content;
  min-width:800px;
  direction:ltr;
}

/* RGB BORDER */
.container::before{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius:20px;
  background:linear-gradient(90deg,#ff004c,#ffb300,#00ff88,#00c3ff,#7a00ff,#ff004c);
  background-size:400% 400%;
  animation:borderMove 6s linear infinite;
  z-index:-1;

  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  padding:3px;
}

@keyframes borderMove{
  0%{background-position:0% 50%}
  100%{background-position:400% 50%}
}

/* LEFT PANEL (LOGO + CLOCK) */
.left{
  width:200px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  background:rgba(0,0,0,0.25);
  backdrop-filter:blur(8px);
  padding:10px;
}

.left img{
  width:120px;
  height:120px;
  object-fit:contain;
  display:none;
}

/* CLOCK */
.clock{
  text-align:center;
  color:#fff;
  margin-bottom:10px;
}

.clock-country{
  font-size:13px;
  opacity:0.8;
}

.clock-time{
  font-size:22px;
  font-weight:bold;
}

/* CENTER */
.center{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:0 40px;
  text-align:center;
}

.title{
  font-size:28px;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.subtitle{
  font-size:18px;
  color:#ddd;
  margin-top:6px;
  max-width:600px;
  overflow:hidden;
}

/* RIGHT ICON */
.right{
  width:120px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.right img{
  width:80px;
  height:80px;
  object-fit:contain;
  display:none;
}

/* ANIMATION */
.fade{animation:fade .4s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

</style>
</head>

<body>

<div class="container" id="box">

  <!-- LEFT -->
  <div class="left">
    <img id="logo">
    <div class="clock" id="clock"></div>
  </div>

  <!-- CENTER -->
  <div class="center">
    <div class="title" id="title"></div>
    <div class="subtitle" id="subtitle"></div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <img id="icon">
  </div>

</div>

<script>

const KEY = "broadcast_settings";
let state = {};
let i = 0;

const zones = [
  {name:"ایران", timezone:"Asia/Tehran"},
  {name:"اروپا", timezone:"Europe/Berlin"},
  {name:"آمریکا", timezone:"America/New_York"},
  {name:"اسرائیل", timezone:"Asia/Jerusalem"}
];

function load(){
  state = JSON.parse(localStorage.getItem(KEY)) || {};
  render();
}

/* RENDER UI */
function render(){

  const box = document.getElementById("box");

  /* TITLE */
  document.getElementById("title").innerText =
    state.title?.text || "";

  /* SUBTITLE */
  document.getElementById("subtitle").innerText =
    state.subtitle?.text || "";

  /* LOGO */
  const logo = document.getElementById("logo");
  if(state.logo?.url){
    logo.src = state.logo.url;
    logo.style.display = "block";
  } else logo.style.display = "none";

  /* ICON */
  const icon = document.getElementById("icon");
  if(state.icon?.type && state.icon.type !== "off"){
    icon.style.display = "block";

    const map = {
      live:"https://static.vecteezy.com/system/resources/previews/023/456/825/non_2x/red-live-button-icon.png",
      breaking:"https://static.vecteezy.com/system/resources/thumbnails/008/506/377/small/breaking-news.png",
      alert:"https://uxwing.com/wp-content/themes/uxwing/download/signs/red-alert-icon.png"
    };

    icon.src = state.icon.type === "custom"
      ? state.icon.url
      : map[state.icon.type];

  } else icon.style.display = "none";

  startClock();

  box.classList.add("fade");
  setTimeout(()=>box.classList.remove("fade"),400);
}

/* CLOCK */
function startClock(){

  const el = document.getElementById("clock");

  setInterval(()=>{

    const z = zones[i % zones.length];

    const t = new Date().toLocaleTimeString("fa-IR",{
      timeZone:z.timezone,
      hour:"2-digit",
      minute:"2-digit",
      hour12:false
    });

    el.innerHTML = `
      <div class="clock-country">${z.name}</div>
      <div class="clock-time">${t}</div>
    `;

    i++;

  }, (state.clock?.interval || 10) * 1000);
}

window.addEventListener("storage", load);
window.addEventListener("broadcast_update", load);

load();

</script>

</body>
</html>
