<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Viewer</title>

<style>
body {
  margin: 0;
  background: transparent;   /* ❌ هیچ بک‌گراندی */
  overflow: hidden;
}

/* 📺 CG BOX - بالا صفحه */
.box {
  position: absolute;
  top: 20px;   /* ⬅️ انتقال از پایین به بالا */
  left: 50%;
  transform: translateX(-50%);

  width: 1200px;
  height: 150px;

  display: flex;
  align-items: center;

  padding: 15px;
  box-sizing: border-box;

  /* 🎬 استایل حرفه‌ای broadcast */
  background: rgba(0,0,0,0.75);
  border-left: 6px solid red;
  border-radius: 10px;

  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);

  color: white;
  font-family: Tahoma;
}

/* لوگو و آیکون */
.logo img, .icon img {
  width: 60px;
  height: 60px;
}

/* متن */
.text {
  flex: 1;
  padding: 0 15px;
}

.t1 {
  font-size: 26px;
  font-weight: bold;
}

.t2 {
  font-size: 14px;
  opacity: 0.85;
}
</style>

</head>

<body>

<div class="box">

  <div class="logo">
    <img id="logo">
  </div>

  <div class="text">
    <div class="t1" id="t1"></div>
    <div class="t2" id="t2"></div>
  </div>

  <div class="icon">
    <img id="icon">
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
