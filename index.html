<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- FONT CSS -->
<link rel="stylesheet" href="assets/fonts/fonts.css">

<title>Broadcast Display</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:transparent;
  overflow:hidden;
  font-family:Vazirmatn, IRANYekanX, IRANSansX, sans-serif;
}

/* =========================
   OUTER WRAPPER
========================= */
.container{
  position:fixed;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  border-radius:16px;
  overflow:hidden;
  align-items:stretch;
  z-index:1;
  background:transparent;
  width:auto;
  min-width:900px;
  isolation:isolate;
}

/* =========================
   BACKGROUND LAYER
========================= */
.bg-layer{
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
}

/* =========================
   CONTENT LAYER
========================= */
.content-layer{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:row;
  align-items:stretch;
  width:100%;
  height:100%;
  direction:ltr;
}

/* =========================
   LOGO
========================= */
.logo{
  order:1;
  width:200px;
  min-width:200px;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;

  background:rgba(0,0,0,0.25);

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);

  overflow:hidden;
}

.logo img{
  width:130px;
  height:130px;
  object-fit:contain;
  display:none;
  flex-shrink:0;
  margin-top:10px;
}

/* =========================
   CLOCK
========================= */
.clock{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:100%;
  margin-top:auto;
  margin-bottom:10px;
  line-height:1.1;
  color:#fff;
  text-align:center;
}

.clock-country{
  font-size:24px;
  opacity:0.8;
  white-space:nowrap;
  margin-bottom:4px;
  font-weight:800;
}

.clock-time{
  font-size:24px;
  font-weight:800;
  white-space:nowrap;
  line-height:1;
}

/* =========================
   TEXT AREA
========================= */
.content{
  order:2;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  min-width:500px;
  flex:1;
  overflow:hidden;
}

/* =========================
   TEXT BLOCK
========================= */
.text{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  width:100%;
  max-width:1000px;
  padding:0 80px;
  margin:0 auto;
  gap:10px;
  direction:rtl;
}

.title{
  font-size:28px;
  color:#fff;
  text-align:center;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  width:100%;
  font-weight:700;
}

.subtitle{
  font-size:18px;
  color:#ddd;
  opacity:0.9;
  text-align:center;

  display:-webkit-box;
  -webkit-line-clamp:1;
  -webkit-box-orient:vertical;

  overflow:hidden;

  margin-top:2px;
  margin-bottom:10px;

  width:100%;
}

/* =========================
   ICON
========================= */
.statusBox{
  width:130px;
  min-width:130px;
  height:100%;
  order:3;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:10px;
  flex-shrink:0;
}

.statusIcon{
  width:100px;
  height:100px;
  object-fit:contain;
  display:none;
}

/* =========================
   ANIMATIONS
========================= */

.fade{
  animation:fadeIn .5s ease;
}

.slide{
  animation:slideIn .5s ease;
}

.zoom{
  animation:zoomIn .5s ease;
}

.glitch{
  animation:glitch .4s infinite;
}

@keyframes fadeIn{
  from{
    opacity:0;
  }
  to{
    opacity:1;
  }
}

@keyframes slideIn{
  from{
    transform:translateX(-50%) translateY(20px);
    opacity:0;
  }
  to{
    transform:translateX(-50%) translateY(0);
    opacity:1;
  }
}

@keyframes zoomIn{
  from{
    transform:translateX(-50%) scale(.95);
    opacity:0;
  }
  to{
    transform:translateX(-50%) scale(1);
    opacity:1;
  }
}

/* =========================
   SAFETY FOR CHROME
========================= */

img{
  user-select:none;
  -webkit-user-drag:none;
}

</style>
</head>

<body>

<div class="container" id="box">

  <div class="bg-layer" id="bg"></div>

  <div class="content-layer">

    <!-- LOGO -->
    <div class="logo">

      <img id="logoImg" alt="Logo">

      <div class="clock" id="clock"></div>

    </div>

    <!-- TEXT -->
    <div class="content">

      <div class="text">

        <div class="title" id="titleText"></div>

        <div class="subtitle" id="subtitleText"></div>

      </div>

    </div>

    <!-- ICON -->
    <div class="statusBox">

      <img id="iconImg" class="statusIcon" alt="Status">

    </div>

  </div>

</div>

<script>

const STORAGE_KEY = "broadcast_settings";

let state = {};
let clockIntervalId = null;
let currentZoneIndex = 0;

/* =========================
   TIME ZONES
========================= */

const zones = [
  {
    name:"ایران",
    timezone:"Asia/Tehran"
  },
  {
    name:"اروپا",
    timezone:"Europe/Berlin"
  },
  {
    name:"آمریکا",
    timezone:"America/New_York"
  },
  {
    name:"اسرائیل",
    timezone:"Asia/Jerusalem"
  }
];

/* =========================
   SAFE LOAD
========================= */

function load(){

  try{

    const saved = localStorage.getItem(STORAGE_KEY);

    state = saved ? JSON.parse(saved) : {};

  }catch(error){

    console.error("LocalStorage Error:", error);

    state = {};
  }

  apply();
}

/* =========================
   APPLY UI
========================= */

function apply(){

  const box = document.getElementById("box");
  const bg = document.getElementById("bg");

  /* CONTAINER */

  const container = state.container || {};

  box.style.width = (container.width || 900) + "px";
  box.style.height = (container.height || 180) + "px";

  bg.style.background = container.bgColor || "#000";
  bg.style.opacity = container.opacity ?? 0.5;

  /* LOGO */

  const logo = document.getElementById("logoImg");

  if(state.logo?.url){

    logo.src = state.logo.url;
    logo.style.display = "block";

  }else{

    logo.removeAttribute("src");
    logo.style.display = "none";
  }

  /* TITLE */

  const title = document.getElementById("titleText");

  title.innerText = state.title?.text || "";

  title.style.fontSize =
    (state.title?.size || 28) + "px";

  title.style.color =
    state.title?.color || "#fff";

  title.style.fontWeight =
    state.title?.weight || 700;

  /* SUBTITLE */

  const sub = document.getElementById("subtitleText");

  sub.innerText = state.subtitle?.text || "";

  sub.style.fontSize =
    (state.subtitle?.size || 18) + "px";

  sub.style.color =
    state.subtitle?.color || "#ddd";

  /* ICON */

  const icon = document.getElementById("iconImg");

  if(state.icon && state.icon.type !== "off"){

    icon.style.display = "block";

    switch(state.icon.type){

      case "custom":
        icon.src = state.icon.url || "";
      break;

      case "live":
        icon.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Live_icon.svg/512px-Live_icon.svg.png";
      break;

      case "breaking":
        icon.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Breaking_News.svg/512px-Breaking_News.svg.png";
      break;

      case "alert":
        icon.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/OOjs_UI_icon_alert-destructive.svg/512px-OOjs_UI_icon_alert-destructive.svg.png";
      break;
    }

    icon.style.width =
      (state.icon.size || 100) + "px";

    icon.style.height =
      (state.icon.size || 100) + "px";

  }else{

    icon.removeAttribute("src");
    icon.style.display = "none";
  }

  applyTransition();

  /* CLOCK */

  const clockEl = document.getElementById("clock");

  if(state.clock?.enabled){

    clockEl.style.display = "flex";
    startClock();

  }else{

    clockEl.style.display = "none";
    stopClock();
  }
}

/* =========================
   TRANSITION
========================= */

function applyTransition(){

  const type =
    state.transition?.type || "fade";

  const box =
    document.getElementById("box");

  box.classList.remove(
    "fade",
    "slide",
    "zoom",
    "glitch"
  );

  void box.offsetWidth;

  box.classList.add(type);
}

/* =========================
   CLOCK
========================= */

function startClock(){

  stopClock();

  currentZoneIndex = 0;

  const interval =
    (state.clock?.interval || 10) * 1000;

  updateClock();

  clockIntervalId = setInterval(()=>{

    currentZoneIndex++;

    if(currentZoneIndex >= zones.length){
      currentZoneIndex = 0;
    }

    updateClock();

  }, interval);
}

function updateClock(){

  const clockEl =
    document.getElementById("clock");

  const zone = zones[currentZoneIndex];

  try{

    const time =
      new Date().toLocaleTimeString(
        "fa-IR",
        {
          timeZone: zone.timezone,
          hour:"2-digit",
          minute:"2-digit",
          hour12:false
        }
      );

    clockEl.innerHTML = `
      <div class="clock-country">
        ${zone.name}
      </div>

      <div class="clock-time">
        ${time}
      </div>
    `;

  }catch(error){

    console.error("Clock Error:", error);
  }
}

/* =========================
   STOP CLOCK
========================= */

function stopClock(){

  if(clockIntervalId){

    clearInterval(clockIntervalId);

    clockIntervalId = null;
  }

  document.getElementById("clock").innerHTML = "";
}

/* =========================
   EVENTS
========================= */

window.addEventListener(
  "storage",
  load
);

window.addEventListener(
  "broadcast_update",
  load
);

/* =========================
   INITIAL LOAD
========================= */

document.addEventListener(
  "DOMContentLoaded",
  load
);

</script>

</body>
</html>
