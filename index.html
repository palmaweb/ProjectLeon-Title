<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Broadcast Display</title>

<link rel="stylesheet" href="assets/fonts/fonts.css">

<style>

body{
  margin:0;
  overflow:hidden;
  background:transparent;
  font-family: Vazirmatn, IRANYekanX, IRANSansX;
}

/* =======================
   MAIN CONTAINER
======================= */
.container{
  position:fixed;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:stretch;
  border-radius:16px;
  overflow:hidden;
  background:rgba(0,0,0,0.55);
  direction:ltr;
  min-width:900px;
  isolation:isolate;
}

/* =======================
   RGB BORDER
======================= */
.container::before{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius:20px;
  background:linear-gradient(
    90deg,
    #ff0000,#ff9900,#ffee00,#00ff00,
    #00ffff,#0066ff,#aa00ff,#ff0066,#ff0000
  );
  background-size:400% 400%;
  animation:borderMove 8s linear infinite;
  z-index:-1;

  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  padding:3px;
}

@keyframes borderMove{
  0%{background-position:0% 50%}
  100%{background-position:400% 50%}
}

/* =======================
   LEFT (LOGO + CLOCK)
======================= */
.left{
  width:200px;
  background:rgba(0,0,0,0.25);
  backdrop-filter:blur(8px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:10px;
}

.left img{
  width:120px;
  height:120px;
  object-fit:contain;
  display:none;
}

/* CLOCK */
.clock{
  text-align:center;
  color:#fff;
  margin-bottom:10px;
  min-height:80px;
}

.clock-country{
  font-size:13px;
  opacity:0.8;
}

.clock-time{
  font-size:22px;
  font-weight:bold;
}

/* =======================
   CENTER TEXT
======================= */
.center{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:0 40px;
  text-align:center;
}

.title{
  font-size:28px;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  width:100%;
}

.subtitle{
  font-size:18px;
  color:#ddd;
  margin-top:6px;
  max-width:600px;
  overflow:hidden;
}

/* =======================
   RIGHT ICON
======================= */
.right{
  width:120px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.right img{
  width:80px;
  height:80px;
  object-fit:contain;
  display:none;
}

/* =======================
   ANIMATION
======================= */
.fade{animation:fade .4s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

</style>
</head>

<body>

<div class="container" id="box">

  <!-- LEFT -->
  <div class="left">
    <img id="logoImg">
    <div class="clock" id="clock"></div>
  </div>

  <!-- CENTER -->
  <div class="center">
    <div class="title" id="titleText"></div>
    <div class="subtitle" id="subtitleText"></div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <img id="iconImg">
  </div>

</div>

<script>

const KEY = "broadcast_settings";

let state = {};
let clockIndex = 0;
let clockTimer = null;

/* TIMEZONES */
const zones = [
  {name:"ایران", timezone:"Asia/Tehran"},
  {name:"اروپا", timezone:"Europe/Berlin"},
  {name:"آمریکا", timezone:"America/New_York"},
  {name:"اسرائیل", timezone:"Asia/Jerusalem"}
];

/* LOAD */
function load(){
  state = JSON.parse(localStorage.getItem(KEY)) || {};
  render();
}

/* APPLY */
function render(){

  const box = document.getElementById("box");

  /* SIZE */
  if(state.container){
    box.style.width = (state.container.width || 900) + "px";
    box.style.height = (state.container.height || 180) + "px";
  }

  /* BACKGROUND */
  const bg = box;
  if(state.container){
    bg.style.background = state.container.bgColor || "rgba(0,0,0,0.55)";
    bg.style.opacity = (state.container.opacity ?? 1);
  }

  /* LOGO */
  const logo = document.getElementById("logoImg");
  if(state.logo?.url){
    logo.src = state.logo.url;
    logo.style.display = "block";
  } else logo.style.display = "none";

  /* TITLE */
  const title = document.getElementById("titleText");
  if(state.title){
    title.innerText = state.title.text || "";
    if(state.title.font) title.style.fontFamily = state.title.font;
    title.style.fontSize = (state.title.size || 28) + "px";
    title.style.color = state.title.color || "#fff";
    title.style.fontWeight = state.title.weight || 700;
  }

  /* SUBTITLE */
  const sub = document.getElementById("subtitleText");
  if(state.subtitle){
    sub.innerText = state.subtitle.text || "";
    if(state.subtitle.font) sub.style.fontFamily = state.subtitle.font;
    sub.style.fontSize = (state.subtitle.size || 18) + "px";
    sub.style.color = state.subtitle.color || "#ddd";
  }

  /* ICON */
  const icon = document.getElementById("iconImg");
  if(state.icon && state.icon.type !== "off"){

    icon.style.display = "block";

    const map = {
      live:"https://static.vecteezy.com/system/resources/previews/023/456/825/non_2x/red-live-button-icon.png",
      breaking:"https://static.vecteezy.com/system/resources/thumbnails/008/506/377/small/breaking-news.png",
      alert:"https://uxwing.com/wp-content/themes/uxwing/download/signs/red-alert-icon.png"
    };

    icon.src = state.icon.type === "custom"
      ? state.icon.url
      : map[state.icon.type];

    icon.style.width = (state.icon.size || 100) + "px";
    icon.style.height = (state.icon.size || 100) + "px";

  } else {
    icon.style.display = "none";
  }

  /* CLOCK */
  if(state.clock?.enabled){
    document.getElementById("clock").style.display = "block";
    startClock();
  } else {
    stopClock();
  }

  box.classList.add("fade");
  setTimeout(()=>box.classList.remove("fade"),400);
}

/* CLOCK */
function startClock(){

  stopClock();
  clockIndex = 0;

  const el = document.getElementById("clock");
  const interval = (state.clock?.interval || 10) * 1000;

  function update(){

    const zone = zones[clockIndex];

    const time = new Date().toLocaleTimeString("fa-IR",{
      timeZone: zone.timezone,
      hour:"2-digit",
      minute:"2-digit",
      hour12:false
    });

    el.innerHTML = `
      <div class="clock-country">${zone.name}</div>
      <div class="clock-time">${time}</div>
    `;

    clockIndex = (clockIndex + 1) % zones.length;
  }

  update();
  clockTimer = setInterval(update, interval);
}

function stopClock(){
  if(clockTimer){
    clearInterval(clockTimer);
    clockTimer = null;
  }
}

/* SYNC */
window.addEventListener("storage", load);
window.addEventListener("broadcast_update", load);

load();

</script>

</body>
</html>
